version: v3.0
name: VsSaros-Win-EXE-Package
on:
  push:
    name: Git事件触发
    branches:
    - '*'
    action:
    - push-file
    - new-branch
  manual: enabled
variables:
  NODE_OPTIONS:
    value: --max-old-space-size=8192
  SAROS_BUILD_MANGLE:
    value: '0'
    allow-modify-at-startup: true
    props:
      type: vuex-input
      description: 0 使用无混淆生产编译（默认）；1 开启旧 TypeScript mangling（耗时和内存较高）
      required: true
  SAROS_PACK_MODE:
    value: standard
    allow-modify-at-startup: true
    props:
      type: vuex-input
      description: 打包模式：standard 外置 Whisper 模型（首用下载约 141 MiB）；offline 保持完整离线
      required: true
  SAROS_SETUP_TARGETS:
    value: user
    allow-modify-at-startup: false
    props:
      type: vuex-input
      description: 仅发布用户级安装包 user；system 和 both 已停止支持
      required: true
  SAROS_MAX_EXE_MB:
    value: '850'
    allow-modify-at-startup: true
    props:
      type: vuex-input
      description: 单个 EXE 的 MiB 上限；超过即禁止上传与发布
      required: true
  SAROS_MAX_EXE_GROWTH_PERCENT:
    value: '10'
    allow-modify-at-startup: true
    props:
      type: vuex-input
      description: 设置 SAROS_PACK_BASELINE_REPORT 时允许的最大体积增长百分比
      required: true
  SAROS_MAX_UPLOAD_MB:
    value: '2048'
    allow-modify-at-startup: true
    props:
      type: vuex-input
      description: 上传到升级服务器的单文件 MiB 上限；必须不低于服务器 MAX_UPLOAD_SIZE
      required: true
  SAROS_MEDIA_MODE:
    value: external
    allow-modify-at-startup: true
    props:
      type: vuex-input
      description: external 不随包 ffmpeg/ffprobe/yt-dlp，运行时回退 PATH/FFMPEG_PATH；bundled 保持零安装
      required: true
  VSSAROS_SKIP_OFFICE_RUNTIME:
    value: '0'
    allow-modify-at-startup: true
    props:
      type: vuex-input
      description: 0 随包 Office Python 运行时和办公技能（不依赖组件服务器）；1 可临时裁剪，但该版本无 Office 文档能力
      required: true
  SAROS_UPDATE_SERVER:
    value: http://21.139.192.124:3030
    readonly: true
    props:
      type: vuex-input
      description: 升级服务器地址
      required: true
  SAROS_PACK_BASELINE_REPORT:
    value: ''
    allow-modify-at-startup: true
    props:
      type: vuex-input
      description: 可选：上次安装包体积报告 JSON 的构建机路径，启用增长预算校验
      required: false
  SAROS_RELEASE_DOWNLOAD_BASE_URL:
    value: ''
    allow-modify-at-startup: true
    props:
      type: vuex-input
      description: 可选：可信公网 HTTPS 下载源（仅 origin）；留空与升级服务器地址一致
      required: false
  WOA_GITLAB_TOKEN:
    value: "${{ settings.WOA_GITLAB_TOKEN.password }}"
    readonly: true
    allow-modify-at-startup: false
    props:
      type: vuex-input
      description: 工蜂 PAT（PRIVATE-TOKEN 头），create-release 步骤创建 GitLab Release 用；值引用蓝盾凭据管理 Key=WOA_GITLAB_TOKEN（Password 类型），不落明文
      required: true
stages:
- name: 编译与打包
  label:
  - Build
  jobs:
    build-win-exe:
      name: Build & Package Windows EXE
      runs-on:
        pool-name: windows
      steps:
      - checkout:
          repo-id: yWNpX
        name: Checkout source
        with:
          refName: main
          # 蓝盾 checkout 默认 `git clean -fd -x` 会删除 node_modules / .build /
          # dsh-runtime / out*，上一轮实测耗时 11m41s。这里关掉 checkout 的 clean，
          # 由下面的 align 步骤只清未跟踪源码（-fd，不带 -x），保留 ignored 构建缓存。
          enableGitClean: false
          enableGitCleanIgnore: false
      - name: Align workspace (keep build caches)
        with:
          charsetType: UTF_8
        continue-on-error: false
        run: |
          powershell -ExecutionPolicy Bypass -File .ci/scripts/align-workspace.ps1
          exit $LASTEXITCODE
        shell: powershell
      - name: Set version
        id: ZXb4BJ
        with:
          charsetType: UTF_8
        continue-on-error: false
        run: |
          powershell -ExecutionPolicy Bypass -File deploy-package/scripts/bk-set-version.ps1
          exit $LASTEXITCODE
        shell: powershell
      - name: Install dependencies (npm ci)
        with:
          charsetType: UTF_8
        continue-on-error: false
        run: |
          powershell -ExecutionPolicy Bypass -File .ci/scripts/install-deps.ps1
          exit $LASTEXITCODE
        shell: powershell
      - 
        # ---------- 3.5 构建 KB markdown webview bundle (kbblocks.js) ----------
        name: Build KB renderer (kbblocks)
        with:
          charsetType: UTF_8
        continue-on-error: false
        run: |
          powershell -ExecutionPolicy Bypass -File .ci/scripts/build-kbblocks.ps1
          exit $LASTEXITCODE
        shell: powershell
      - 
        name: Compile production build (optional mangling)
        with:
          charsetType: UTF_8
        continue-on-error: false
        run: |
          powershell -ExecutionPolicy Bypass -File .ci/scripts/compile-build.ps1
          exit $LASTEXITCODE
        shell: powershell
      - 
        # ---------- 4.5 复制 kbblocks webview 资源到 out-build ----------
        name: Copy KB webview resources to out-build
        with:
          charsetType: UTF_8
        continue-on-error: false
        run: |
          powershell -ExecutionPolicy Bypass -File .ci/scripts/copy-kbblocks.ps1
          exit $LASTEXITCODE
        shell: powershell
      - 
        # ---------- 5.0 构建能力插件（dist/extension.js） ----------
        name: Transpile plugins
        with:
          charsetType: UTF_8
        continue-on-error: false
        run: |
          powershell -ExecutionPolicy Bypass -File .ci/scripts/transpile-plugins.ps1
          exit $LASTEXITCODE
        shell: powershell
      - 
        name: Compile extensions
        with:
          charsetType: UTF_8
        continue-on-error: false
        run: |
          powershell -ExecutionPolicy Bypass -File .ci/scripts/compile-extensions.ps1
          exit $LASTEXITCODE
        shell: powershell
      - 
        name: Package vscode-win32-x64
        with:
          charsetType: UTF_8
        continue-on-error: false
        run: |
          powershell -ExecutionPolicy Bypass -File .ci/scripts/package-vscode.ps1
          exit $LASTEXITCODE
        shell: powershell
      - 
        # ---------- 6.4 下载并内置 ffmpeg（vox 口播视频可选依赖，失败不阻断） ----------
        name: Bundle ffmpeg
        with:
          charsetType: UTF_8
        continue-on-error: false
        run: |
          powershell -ExecutionPolicy Bypass -File .ci/scripts/bundle-ffmpeg.ps1
          exit $LASTEXITCODE
        shell: powershell
      - 
        # ---------- 6.4b 下载并内置 whisper.cpp（本地 ASR：video_analyze 口播转写，可选依赖，失败不阻断） ----------
        # 与 ffmpeg 同级策略；CI 无法访问 GitHub/HuggingFace 时用 SAROS_WHISPER_URL /
        # SAROS_WHISPER_MODEL_URL 指向内网镜像。
        name: Bundle whisper
        with:
          charsetType: UTF_8
        continue-on-error: false
        run: |
          powershell -ExecutionPolicy Bypass -File .ci/scripts/bundle-whisper.ps1
          exit $LASTEXITCODE
        shell: powershell
      - 
        # ---------- 6.5 打包产物关键构件验证 ----------
        name: Verify staging contents
        with:
          charsetType: UTF_8
        continue-on-error: false
        run: |
          powershell -ExecutionPolicy Bypass -File .ci/scripts/verify-staging.ps1
          exit $LASTEXITCODE
        shell: powershell
      - 
        name: Generate EXE installers (selected targets)
        continue-on-error: false
        with:
          charsetType: UTF_8
        run: |
          powershell -ExecutionPolicy Bypass -File .ci/scripts/generate-exe.ps1
          exit $LASTEXITCODE
        shell: powershell
      - name: Archive installers
        id: Rz97AF
        # 使用 BK-CI 默认的前序成功运行条件，避免不受支持的 success() 表达式。
        continue-on-error: false
        uses: UploadArtifactory@8.*
        with:
          filePath: .build/win32-x64/user-setup/VsSarosUserSetup.exe
          downloadFiles: "[{\"path\":\"\",\"param\":\"\"}]"
      - name: Upload installers to update server
        id: hgg5hu
        with:
          charsetType: UTF_8
        continue-on-error: false
        run: |
          powershell -ExecutionPolicy Bypass -File deploy-package/scripts/bk-pipeline-upload.ps1
          exit $LASTEXITCODE
        shell: powershell
      - 
        # ---------- 7.0 创建 Release：changelog + git tag + woa.git/GitHub 双端 ----------
        name: Create release (tag + changelog + woa.git/GitHub)
        with:
          charsetType: UTF_8
        continue-on-error: false
        run: |
          powershell -ExecutionPolicy Bypass -File .ci/scripts/create-release.ps1
          exit $LASTEXITCODE
        shell: powershell
      - name: Archive size reports and upload receipts
        uses: UploadArtifactory@8.*
        with:
          filePath: .build/pack-reports/**/*.json
          downloadFiles: "[{\"path\":\"\",\"param\":\"\"}]"
concurrency: {}
syntax-dialect: INHERIT
