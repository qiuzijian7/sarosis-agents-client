version: v3.0
name: VsSaros-Win-EXE-Package
on:
  push:
    name: Git事件触发
    branches:
    - '*'
    action:
    - push-file
    - new-branch
  manual: enabled
variables:
  NODE_OPTIONS:
    value: --max-old-space-size=8192
  SAROS_UPDATE_SERVER:
    value: http://zijianqiu-any1.devcloud.woa.com:3030
    readonly: true
    props:
      type: vuex-input
      description: 升级服务器地址
      required: true
stages:
- name: 编译与打包
  label:
  - Build
  jobs:
    build-win-exe:
      name: Build & Package Windows EXE
      runs-on:
        pool-name: windows
      steps:
      - checkout:
          repo-id: yWNpX
        name: 拉取源码
        with:
          refName: main
      - name: 设置版本号
        id: ZXb4BJ
        with:
          charsetType: UTF_8
        run: ' powershell -ExecutionPolicy Bypass -File deploy-package/scripts/bk-set-version.ps1'
        shell: powershell
      - name: 安装依赖 (npm ci)
        with:
          charsetType: UTF_8
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/install-deps.ps1'
        shell: powershell

      # ---------- 3.5 构建 KB markdown webview bundle (kbblocks.js) ----------
      - name: 构建 KB 渲染 bundle (kbblocks)
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/build-kbblocks.ps1'
        shell: powershell

      - name: 生产编译 compile-build-with-mangling
        with:
          charsetType: UTF_8
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/compile-build.ps1'
        shell: powershell

      # ---------- 4.5 复制 kbblocks webview 资源到 out-build ----------
      - name: 复制 kbblocks webview 资源到 out-build
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/copy-kbblocks.ps1'
        shell: powershell

      # ---------- 5.0 构建能力插件（dist/extension.js） ----------
      - name: 构建能力插件 transpile-plugins
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/transpile-plugins.ps1'
        shell: powershell

      - name: 编译扩展 compile-extensions-build
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/compile-extensions.ps1'
        shell: powershell

      - name: 打包 vscode-win32-x64
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/package-vscode.ps1'
        shell: powershell

      # ---------- 6.4 下载并内置 ffmpeg（vox 口播视频可选依赖，失败不阻断） ----------
      - name: 下载并内置 ffmpeg (bundle-ffmpeg)
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/bundle-ffmpeg.ps1'
        shell: powershell

      # ---------- 6.5 打包产物关键构件验证 ----------
      - name: 验证打包关键构件
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/verify-staging.ps1'
        shell: powershell

      - name: 生成 EXE 安装包 (user & system setup)
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/generate-exe.ps1'
        shell: powershell
      - name: 归档构件
        id: Rz97AF
        uses: UploadArtifactory@8.*
        with:
          filePath: .build/win32-x64/**/*.exe
          downloadFiles: "[{\"path\":\"\",\"param\":\"\"}]"
      - name: 上传 exe 到升级服务器
        id: hgg5hu
        with:
          charsetType: UTF_8
        run: ' powershell -ExecutionPolicy Bypass -File deploy-package/scripts/bk-pipeline-upload.ps1'
        shell: powershell
concurrency: {}
syntax-dialect: INHERIT
