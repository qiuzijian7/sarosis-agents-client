version: v3.0

# ============================================================
# VsSaros Windows EXE 打包流水线 (蓝盾 Pipeline-as-Code v3.0)
# ------------------------------------------------------------
# 触发：origin 仓库 (git.woa.com/zijianqiu/vssaros-agents-client)
#       任意分支有新提交 (push) 立即触发打包。
# 排队：需在蓝盾流水线 UI → "流水线设置" → "并发控制" 中配置
#       "同一时间只允许运行 1 个构建，其余排队等待"。
# 版本：2.1.${x}，x = 当前 git 提交总数 (git rev-list --count HEAD)，
#       递增整数，最贴近 SVN changelist 语义。
# 产物：.build/win32-x64/ 下的 system / user setup exe 安装包。
# ============================================================

name: "VsSaros-Win-EXE-Package"

label:
  - "打包"
  - "Windows"

# ---- 触发器：仓库任意分支有 push 即触发 ----
on:
  push:
    branches:
      - "*"

# ---- 全局变量 ----
variables:
  NODE_OPTIONS:
    value: "--max-old-space-size=8192"

stages:
  - name: "编译与打包"
    jobs:
      build-win-exe:
        name: "Build & Package Windows EXE"
        # Windows 构建机（按实际可用的 Windows 公共/私有构建集群调整）
        # 资源规格 (cpu/memory) 请在蓝盾 UI job 配置中设置
        runs-on:
          pool-name: "windows"
          # 如使用私有构建机，取消下行注释并设为 true
          # self-hosted: true
        steps:
          # ---------- 0. 拉取源码（PAC 必须显式 checkout） ----------
          - checkout: self
            name: "拉取源码"
            with:
              enableGitLfs: false

          # ---------- 1. 计算动态版本号 2.1.x ----------
          - name: "计算版本号 2.1.x (x = git 提交计数)"
            id: calc_version
            run: |
              # 确保有完整提交历史（浅克隆会导致 count 不准）
              git fetch --unshallow 2>$null
              $count = (git rev-list --count HEAD).Trim()
              $version = "2.1.$count"
              Write-Host "Resolved package version: $version"
              # 写入蓝盾 step 输出变量，供后续 step 通过 steps.<id>.outputs.<name> 引用
              Write-Host "::set-output name=BUILD_VERSION::$version"
            shell: powershell

          # ---------- 2. 将版本号写入 package.json / product.json ----------
          - name: "注入版本号到 package.json 和 product.json"
            run: |
              $v = "${{ steps.calc_version.outputs.BUILD_VERSION }}"
              Write-Host "Stamping version $v into package.json & product.json"

              $pkgPath = "package.json"
              $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
              $pkg.version = $v
              $pkg | ConvertTo-Json -Depth 100 | Set-Content $pkgPath -Encoding UTF8

              $prodPath = "product.json"
              $prod = Get-Content $prodPath -Raw | ConvertFrom-Json
              $prod.version = $v
              $prod | ConvertTo-Json -Depth 100 | Set-Content $prodPath -Encoding UTF8

              Write-Host "package.json version  = $($pkg.version)"
              Write-Host "product.json version  = $($prod.version)"
            shell: powershell

          # ---------- 3. 安装依赖 ----------
          - name: "安装依赖 (npm install + rebuild)"
            run: |
              # ===== 1. Node =====
              $nodeVersion = "22.22.1"
              if (-not (nvm list 2>$null | Select-String $nodeVersion)) { nvm install $nodeVersion }
              nvm use $nodeVersion
              node --version

              # ===== 2. Cleanup =====
              cmd /c "rd /s /q node_modules 2>nul"
              cmd /c "rd /s /q build\node_modules 2>nul"

              # ===== 3. Install Spectre (first run only) =====
              $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Community"
              $vsInstaller = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
              $latestMsvc = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory -EA SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
              if ($latestMsvc -and -not (Test-Path "$vsPath\VC\Tools\MSVC\$($latestMsvc.Name)\lib\spectre\x64\libcmt.lib")) {
                Write-Host "=== Installing Spectre Libraries ==="
                & "$vsInstaller" modify --installPath $vsPath --quiet --norestart `
                  --add Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre `
                  --add Microsoft.VisualStudio.Component.VC.ATL.Spectre `
                  --add Microsoft.VisualStudio.Component.VC.MFC.Spectre 2>&1 | Out-Null
              }
              cmd /c "rd /s /q `"$vsPath\VC\Tools\MSVC\14.38.33130`" 2>nul"

              # ===== 4. Env vars for Electron native build =====
              $env:GYP_MSVS_VERSION      = "2022"
              $env:npm_config_target     = "39.8.8"
              $env:npm_config_runtime    = "electron"
              $env:npm_config_disturl    = "https://electronjs.org/headers"
              $env:npm_config_arch       = "x64"
              $env:npm_config_target_arch = "x64"
              $env:npm_config_build_from_source = "true"
              $env:npm_config_registry   = "https://registry.npmmirror.com/"
              $env:ELECTRON_MIRROR       = "https://npmmirror.com/mirrors/electron/"

              # ===== 5. Install root dependencies =====
              # FIX: --ignore-scripts avoids ripgrep GitHub 403 postinstall failure
              # which causes npm to rollback and delete all packages.
              npm install --ignore-scripts
              if ($LASTEXITCODE -ne 0) { Write-Error "FATAL: npm install --ignore-scripts failed"; exit 1 }

              # Rebuild native modules only (avoids ripgrep rebuild script)
              npm rebuild `
                @parcel/watcher @vscode/native-watchdog @vscode/policy-watcher `
                @vscode/spdlog @vscode/windows-process-tree @vscode/windows-registry `
                @vscode/deviceid @vscode/sqlite3 @vscode/windows-mutex `
                @vscode/windows-ca-certs kerberos native-keymap node-pty `
                windows-foreground-love `
                --foreground-scripts
              if ($LASTEXITCODE -ne 0) { Write-Error "FATAL: native rebuild failed"; exit 1 }

              # ===== 5.5 @vscode/sqlite3 原生模块（图谱 SQLite 后端必需）=====
              # 注意：@vscode/sqlite3 无 install 脚本 → npm rebuild 对它空操作；
              # lib/sqlite3-binding.js 硬编码 require('../build/Release/vscode-sqlite3.node')。
              # 缺失 → 打包版 search_graph/query_graph/get_code_snippet 走 SQLite 后端必挂。
              # 优先用 vendored 兜底（build/saros/bin/vscode-sqlite3.node，随仓库 checkout 到位）。
              $sqliteNode = "node_modules\@vscode\sqlite3\build\Release\vscode-sqlite3.node"
              if (-not (Test-Path $sqliteNode)) {
                $vendoredSqlite = "build\saros\bin\vscode-sqlite3.node"
                if (Test-Path $vendoredSqlite) {
                  New-Item -ItemType Directory -Force -Path (Split-Path $sqliteNode) | Out-Null
                  Copy-Item $vendoredSqlite $sqliteNode -Force
                  Write-Host "[FIX] @vscode/sqlite3 native restored from vendored: $sqliteNode"
                }
              }
              if (-not (Test-Path $sqliteNode)) {
                Write-Error "FATAL: @vscode/sqlite3 native binary missing (node_modules\@vscode\sqlite3\build\Release\vscode-sqlite3.node) — 图谱 SQLite 后端不可用"
                exit 1
              }
              Write-Host "[OK] @vscode/sqlite3 native binary present ($((Get-Item $sqliteNode).Length) bytes)"

              if (-not (Test-Path "node_modules\gulp\bin\gulp.js")) {
                Write-Error "FATAL: node_modules/gulp not found after npm install + rebuild"
                exit 1
              }
              Write-Host "[OK] node_modules/gulp found"

              # ===== 6. Install build/ dependencies =====
              Push-Location build
              npm install --ignore-scripts
              if ($LASTEXITCODE -ne 0) { Write-Error "FATAL: build/ npm install failed"; exit 1 }

              # FIX: tree-sitter binding.gyp forces /std:c++17, but Node 39.8.8 requires C++20
              $tsGyp = "node_modules\tree-sitter\binding.gyp"
              if (Test-Path $tsGyp) {
                $gypContent = Get-Content $tsGyp -Raw
                $gypContent = $gypContent -replace '/std:c\+\+17', '/std:c++20'
                [System.IO.File]::WriteAllText((Resolve-Path $tsGyp), $gypContent, (New-Object System.Text.UTF8Encoding $false))
                Write-Host "[FIX] tree-sitter binding.gyp patched: /std:c++17 -> /std:c++20"
              }

              # FIX: only rebuild tree-sitter (the single native module build/ needs).
              # Full "npm rebuild" triggers ripgrep postinstall -> GitHub 403 -> fail.
              npm rebuild tree-sitter --foreground-scripts
              if ($LASTEXITCODE -ne 0) { Write-Error "FATAL: build/ tree-sitter rebuild failed"; exit 1 }
              Pop-Location

              # ===== 7. ripgrep download =====
              # Priority: npmmirror CDN(zip) → GitHub postinstall → build/ copy → vendored → HARD FAIL
              # 必须在 Step 6（vscode-win32-x64 生成 asar/暂存）之前完成，否则 rg 进不了包。
              $mainRg = "node_modules\@vscode\ripgrep\bin\rg.exe"
              $buildRg = "build\node_modules\@vscode\ripgrep\bin\rg.exe"
              if (-not (Test-Path $mainRg)) {
                # Try npmmirror CDN first (no GitHub dependency)。
                # 2026-08-05 修正：原 URL（/-/binary/ripgrep/vX/...rg.exe）恒 404；
                # 有效地址是 ripgrep-prebuilt 项目的 zip 包（已实测 200），需下载后解压取 rg.exe。
                # 参考 void：信任 @vscode/ripgrep 包自身版本，杜绝硬编码过期版本。
                # 二进制真实版本由该包 lib/postinstall.js 的 VERSION 常量决定
                # （当前 @vscode/ripgrep@1.17.x -> ripgrep v15.0.1）。下次升级包时
                # 此解析会自动跟随，无需人工同步，避免下载到不存在/错误的版本。
                $rgVersion = "v15.0.1"   # 兜底；优先从已安装包解析
                $postinstall = Join-Path $PWD "node_modules/@vscode/ripgrep/lib/postinstall.js"
                if (Test-Path $postinstall) {
                    $pc = Get-Content $postinstall -Raw
                    if ($pc -match "VERSION\s*=\s*'([^']+)'") { $rgVersion = $Matches[1] }
                }
                if ($rgVersion -notmatch '^v') { $rgVersion = "v$rgVersion" }
                Write-Host "ripgrep 目标版本（来自已安装 @vscode/ripgrep）: $rgVersion"
                $rgZipUrls = @(
                  "https://registry.npmmirror.com/-/binary/ripgrep-prebuilt/v$rgVersion/ripgrep-v$rgVersion-x86_64-pc-windows-msvc.zip",
                  "https://cdn.npmmirror.com/binaries/ripgrep-prebuilt/v$rgVersion/ripgrep-v$rgVersion-x86_64-pc-windows-msvc.zip"
                )
                $rgZip = Join-Path $env:TEMP "rg-$rgVersion.zip"
                $rgExtract = Join-Path $env:TEMP "rg-$rgVersion-extract"
                foreach ($rgUrl in $rgZipUrls) {
                  if (Test-Path $mainRg) { break }
                  Write-Host "[RG] Trying npmmirror CDN: $rgUrl"
                  try {
                    Invoke-WebRequest -Uri $rgUrl -OutFile $rgZip -TimeoutSec 60 -UseBasicParsing
                    if ((Get-Item $rgZip).Length -lt 100000) { throw "Downloaded zip too small (likely error page)" }
                    if (Test-Path $rgExtract) { Remove-Item $rgExtract -Recurse -Force }
                    Expand-Archive -Path $rgZip -DestinationPath $rgExtract -Force
                    $rgBin = Get-ChildItem $rgExtract -Recurse -Filter rg.exe | Select-Object -First 1
                    if (-not $rgBin) { throw "rg.exe not found inside zip" }
                    $rgDir = Split-Path $mainRg
                    New-Item -Force -ItemType Directory $rgDir | Out-Null
                    Copy-Item $rgBin.FullName $mainRg -Force
                    Write-Host "[RG] Downloaded from npmmirror CDN ($([math]::Round((Get-Item $mainRg).Length/1MB, 2)) MB)"
                  } catch {
                    Write-Host "[RG] npmmirror CDN failed: $_"
                    if (Test-Path $mainRg) { Remove-Item $mainRg -Force -EA SilentlyContinue }
                  }
                }
                Remove-Item $rgZip -Force -EA SilentlyContinue
                Remove-Item $rgExtract -Recurse -Force -EA SilentlyContinue
              }
              if (-not (Test-Path $mainRg)) {
                Write-Host "[RG] Trying GitHub postinstall..."
                try {
                  node node_modules/@vscode/ripgrep/lib/postinstall.js
                  if (-not (Test-Path $mainRg)) { throw "postinstall completed but rg.exe not found" }
                  Write-Host "[RG] Downloaded via GitHub postinstall"
                } catch {
                  Write-Host "[RG] GitHub postinstall failed: $_"
                }
              }
              if (-not (Test-Path $mainRg) -and (Test-Path $buildRg)) {
                Copy-Item $buildRg $mainRg -Force
                Write-Host "[RG] Copied from build/"
              }
              # 仓库内嵌兜底（离线/镜像全挂也能出包）：build/saros/bin/rg.exe
              # 此前三回退全失败仅 WARN 继续打包 → 打包版 rg 缺失，内容搜索降级慢速 walk
              # （生产日志 1785894964584：12+ 次 search_code 恒 27-32s 全 no matches）。
              $vendoredRg = "build/saros/bin/rg.exe"
              if (-not (Test-Path $mainRg) -and (Test-Path $vendoredRg)) {
                Copy-Item $vendoredRg $mainRg -Force
                Write-Host "[RG] Restored from vendored build/saros/bin/rg.exe"
              }
              if (-not (Test-Path $mainRg)) {
                Write-Error "rg.exe unavailable after all fallbacks (npmmirror/GitHub/build/vendored). Refusing to package without ripgrep."
                exit 1
              }

              # ===== 8. Install extension dependencies =====
              # root --ignore-scripts skipped postinstall.ts, which normally
              # installs deps for all subdirectories (extensions, remote, etc).
              # Extensions with esbuild bundling (markdown-language-features) need
              # their own node_modules (e.g. dompurify) to compile.
              $extRoots = Get-ChildItem extensions -Directory -Depth 2
              foreach ($extDir in $extRoots) {
                if (Test-Path "$($extDir.FullName)/package.json") {
                  Push-Location $extDir.FullName
                  npm install --ignore-scripts
                  if ($LASTEXITCODE -ne 0) {
                    Write-Host "[WARN] $extDir npm install exited $LASTEXITCODE (non-critical)"
                  }
                  Pop-Location
                }
              }
              Write-Host "[OK] Extension dependencies installed"

              # ===== 8b. Install .vscode/extensions dependencies =====
              if (Test-Path ".vscode/extensions") {
                $vscExtRoots = Get-ChildItem .vscode/extensions -Directory
                foreach ($extDir in $vscExtRoots) {
                  if (Test-Path "$($extDir.FullName)/package.json") {
                    Push-Location $extDir.FullName
                    npm install --ignore-scripts
                    if ($LASTEXITCODE -ne 0) {
                      Write-Host "[WARN] $extDir npm install exited $LASTEXITCODE (non-critical)"
                    }
                    Pop-Location
                  }
                }
                Write-Host "[OK] .vscode/extensions dependencies installed"
              }

              # ===== 8c. Hoist typescript to extensions/node_modules =====
              # extensions/typescript-language-features/src/tsServer/protocol/protocol.d.ts
              # references "../../../../node_modules/typescript/lib/typescript" which
              # resolves to extensions/node_modules/typescript. Normally postinstall.ts
              # runs `npm install` at extensions/ root which hoists typescript there.
              # We bypass that, so we manually copy from root node_modules/typescript.
              $extTsTarget = "extensions\node_modules\typescript"
              $rootTs = "node_modules\typescript"
              if ((Test-Path $rootTs) -and -not (Test-Path $extTsTarget)) {
                New-Item -Force -ItemType Directory "extensions\node_modules" | Out-Null
                # Use junction (fast, no copy). Falls back to copy if junction fails.
                cmd /c "mklink /J `"$extTsTarget`" `"$((Resolve-Path $rootTs).Path)`"" 2>&1 | Out-Null
                if (-not (Test-Path "$extTsTarget\lib\typescript.d.ts")) {
                  Write-Host "[INFO] junction failed, falling back to copy"
                  Copy-Item -Recurse -Force $rootTs $extTsTarget
                }
                Write-Host "[FIX] typescript hoisted to $extTsTarget"
              }

              # ===== 8d. Install Agent Studio webview dependencies =====
              # The KB markdown renderer (kbblocks) bundles katex + react-markdown via
              # esbuild from the webview's OWN node_modules. The root --ignore-scripts
              # install does NOT cover this sub-directory, so katex/dist/katex.min.css
              # is missing at build time -> esbuild fails with ENOENT. Install it here,
              # mirroring the extensions loop above.
              $webviewDir = "src\vs\sessions\contrib\agentStudio\webview"
              if (Test-Path "$webviewDir\package.json") {
                Push-Location $webviewDir
                npm install --ignore-scripts
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "[WARN] $webviewDir npm install exited $LASTEXITCODE (non-critical)"
                }
                Pop-Location
                Write-Host "[OK] Agent Studio webview dependencies installed"
              } else {
                Write-Host "[WARN] $webviewDir/package.json not found, skipping webview install"
              }
            shell: powershell

          # ---------- 4. 生产编译（带 mangling，失败回退 dev 编译） ----------
          - name: "生产编译 compile-build-with-mangling"
            run: |
              # Ensure nvm Node is on PATH for child processes (gulp->esbuild)
              $nvmNodeDir = "$env:LOCALAPPDATA\nvm\v22.22.1"
              $env:PATH = "$nvmNodeDir;$env:PATH"
              node --version
              Get-Command node | Select-Object Source

              npx gulp compile-build-with-mangling --verbose
              if ($LASTEXITCODE -ne 0) {
                Write-Host "compile-build-with-mangling failed, fallback to dev compile..."
                npm run compile
                if ($LASTEXITCODE -ne 0) { Write-Error "Compile failed"; exit 1 }
              }
            shell: powershell

          # ---------- 4.5 构建能力插件（dist/extension.js） ----------
          # compile-build-with-mangling 走经典 tsc+mangle（compilation.ts），不经过
          # build/next transpile()，因此不会执行 transpileCapabilityPlugins——
          # extensions/<name>/dist/extension.js 不会被刷新/产出。
          # 缺失时打包版 AgentCapability 回退路径 extensions/<name>/dist/extension.js 404
          # （生产日志 1785894964584：agentmemory-memory 能力插件加载失败）。
          - name: "构建能力插件 transpile-plugins"
            run: |
              $nvmNodeDir = "$env:LOCALAPPDATA\nvm\v22.22.1"
              $env:PATH = "$nvmNodeDir;$env:PATH"
              node build/next/index.ts transpile-plugins
              if ($LASTEXITCODE -ne 0) { Write-Error "transpile-plugins failed"; exit 1 }
              if (-not (Test-Path "extensions/agentmemory-memory/dist/extension.js")) {
                Write-Error "agentmemory-memory/dist/extension.js not produced"; exit 1
              }
            shell: powershell

          # ---------- 5. 编译内置扩展 ----------
          - name: "编译扩展 compile-extensions-build"
            run: |
              # Delete extensions known to fail vsce packaging (workspace cache safety)
              cmd /c "rd /s /q extensions\hermes-agent 2>nul"
              cmd /c "rd /s /q extensions\execution-example 2>nul"
              cmd /c "rd /s /q extensions\kanban-example 2>nul"
              cmd /c "rd /s /q extensions\memory-example 2>nul"
              cmd /c "rd /s /q extensions\planning-example 2>nul"
              cmd /c "rd /s /q extensions\retrieval-example 2>nul"
              cmd /c "rd /s /q extensions\tool-example 2>nul"
              # Force shared/package.json to the correct name. The build workspace is
              # REUSED across runs, so a stale @saros/shared can linger even though the
              # repo is already saros-shared -> vsce rejects "@scope/name".
              # This content is pure ASCII (no Chinese). MUST write WITHOUT BOM:
              # PowerShell 5.1 'Set-Content -Encoding utf8' prepends a UTF-8 BOM (EF BB BF),
              # which vsce's JSON.parse rejects ("Unexpected token, \ufeff{name}..."). Use
              # UTF8Encoding($false) via WriteAllText to guarantee a BOM-free file.
              $sharedJson = '{"name":"saros-shared","version":"1.0.0","description":"Shared utilities","main":"./out/index.js","engines":{"vscode":"^1.95.0"},"activationEvents":[],"types":"./out/index.d.ts","dependencies":{},"scripts":{"compile":"tsc -p ./","watch":"tsc -watch -p ./"},"devDependencies":{"@types/node":"22.x","@types/vscode":"^1.95.0","typescript":"^6.0.3"}}'
              [IO.File]::WriteAllText("$pwd\extensions\shared\package.json", $sharedJson, (New-Object Text.UTF8Encoding $false))
              # DO NOT rewrite codebuddy-provider/package.json: it contains Chinese in
              # "description"; Get-Content/Set-Content under GBK corrupts those bytes and
              # triggers "Bad control character" JSON parse errors. The repo copy is already
              # correct (dep=saros-shared, UTF-8). Just reinstall to refresh the symlink.
              Push-Location extensions\codebuddy-provider
              Remove-Item -Recurse -Force -EA SilentlyContinue node_modules\@vssaros
              Remove-Item -Recurse -Force -EA SilentlyContinue node_modules\saros-shared
              npm install --ignore-scripts
              Pop-Location

              npx gulp compile-extensions-build --verbose
              if ($LASTEXITCODE -ne 0) { Write-Error "Extensions build failed"; exit 1 }
            shell: powershell

          # ---------- 6. 打包 Win32 x64 应用目录 ----------
          - name: "打包 vscode-win32-x64"
            run: |
              npx gulp vscode-win32-x64 --verbose
              if ($LASTEXITCODE -ne 0) { Write-Error "Packaging failed"; exit 1 }
            shell: powershell

          # ---------- 6.5 打包产物关键构件验证（缺失即失败，禁止带病出包） ----------
          # 历史事故（生产日志 1785894964584）：rg.exe 缺失→搜索降级慢速 walk；
          # agentmemory dist 缺失→能力插件 404；kbWorker.js 缺失→KB worker 404 回退主线程。
          - name: "验证打包关键构件"
            run: |
              $appRoot = Join-Path (Split-Path $pwd.Path -Parent) "VSCode-win32-x64\resources\app"
              if (-not (Test-Path $appRoot)) { $appRoot = "..\VSCode-win32-x64\resources\app" }
              Write-Host "Verifying staging dir: $appRoot"
              $required = @(
                "node_modules\@vscode\ripgrep\bin\rg.exe",
                "extensions\agentmemory-memory\dist\extension.js",
                "out\vs\sessions\contrib\agentStudio\browser\views\knowledgeBase\kbWorker.js",
                "out\vs\sessions\sessions.desktop.main.js"
              )
              $missing = @()
              foreach ($rel in $required) {
                $p = Join-Path $appRoot $rel
                if (Test-Path $p) { Write-Host "  [OK] $rel" }
                else { Write-Host "  [MISSING] $rel"; $missing += $rel }
              }
              if ($missing.Count -gt 0) {
                Write-Error ("Staging verification failed, missing:`n - " + ($missing -join "`n - "))
                exit 1
              }
              Write-Host "[OK] All critical artifacts present in staging."
            shell: powershell

          # ---------- 7. 生成 EXE 安装包（user + system setup） ----------
          - name: "生成 EXE 安装包 (user & system setup)"
            run: |
              npx gulp vscode-win32-x64-inno-updater --verbose
              if ($LASTEXITCODE -ne 0) { Write-Error "Inno updater setup failed"; exit 1 }
              npx gulp vscode-win32-x64-user-setup --verbose
              if ($LASTEXITCODE -ne 0) { Write-Error "User setup failed"; exit 1 }
              npx gulp vscode-win32-x64-system-setup --verbose
              if ($LASTEXITCODE -ne 0) { Write-Error "System setup failed"; exit 1 }
            shell: powershell

          # ---------- 8. 归档 EXE 产物 ----------
          - name: "归档 EXE 产物"
            uses: "archiveArtifact@8.*"
            with:
              filePath: ".build/win32-x64/**/*.exe"
