version: v3.0
name: VsSaros-Win-EXE-Package
on:
  push:
    name: Git事件触发
    branches:
    - '*'
    action:
    - push-file
    - new-branch
  manual: enabled
variables:
  NODE_OPTIONS:
    value: --max-old-space-size=8192
  SAROS_PACK_MODE:
    value: offline
    allow-modify-at-startup: true
    props:
      type: vuex-input
      description: 打包模式：offline 保持完整离线能力；standard 外置 Whisper 模型（首用下载约 141 MiB）
      required: true
  SAROS_SETUP_TARGETS:
    value: both
    allow-modify-at-startup: true
    props:
      type: vuex-input
      description: 安装包目标：both / user / system；日常验证可选 user 减少重复压缩
      required: true
  SAROS_MAX_EXE_MB:
    value: '850'
    allow-modify-at-startup: true
    props:
      type: vuex-input
      description: 单个 EXE 的 MiB 上限；超过即禁止上传与发布
      required: true
  SAROS_MAX_EXE_GROWTH_PERCENT:
    value: '10'
    allow-modify-at-startup: true
    props:
      type: vuex-input
      description: 设置 SAROS_PACK_BASELINE_REPORT 时允许的最大体积增长百分比
      required: true
  SAROS_UPDATE_SERVER:
    value: http://21.139.192.124:3030
    readonly: true
    props:
      type: vuex-input
      description: 升级服务器地址
      required: true
  SAROS_PACK_BASELINE_REPORT:
    value: ''
    allow-modify-at-startup: true
    props:
      type: vuex-input
      description: 可选：上次安装包体积报告 JSON 的构建机路径，启用增长预算校验
      required: false
  SAROS_RELEASE_DOWNLOAD_BASE_URL:
    value: ''
    allow-modify-at-startup: true
    props:
      type: vuex-input
      description: 可选：可信公网 HTTPS 下载源（仅 origin）；留空与升级服务器地址一致
      required: false
  WOA_GITLAB_TOKEN:
    value: "${{ settings.WOA_GITLAB_TOKEN.password }}"
    readonly: true
    allow-modify-at-startup: false
    props:
      type: vuex-input
      description: 工蜂 PAT（PRIVATE-TOKEN 头），create-release 步骤创建 GitLab Release 用；值引用蓝盾凭据管理 Key=WOA_GITLAB_TOKEN（Password 类型），不落明文
      required: true
stages:
- name: 编译与打包
  label:
  - Build
  jobs:
    build-win-exe:
      name: Build & Package Windows EXE
      runs-on:
        pool-name: windows
      steps:
      - checkout:
          repo-id: yWNpX
        name: Checkout source
        with:
          refName: main
      - name: Set version
        id: ZXb4BJ
        with:
          charsetType: UTF_8
        run: ' powershell -ExecutionPolicy Bypass -File deploy-package/scripts/bk-set-version.ps1'
        shell: powershell
      - name: Install dependencies (npm ci)
        with:
          charsetType: UTF_8
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/install-deps.ps1'
        shell: powershell
      - 
        # ---------- 3.5 构建 KB markdown webview bundle (kbblocks.js) ----------
        name: Build KB renderer (kbblocks)
        with:
          charsetType: UTF_8
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/build-kbblocks.ps1'
        shell: powershell
      - 
        name: Compile build with mangling
        with:
          charsetType: UTF_8
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/compile-build.ps1'
        shell: powershell
      - 
        # ---------- 4.5 复制 kbblocks webview 资源到 out-build ----------
        name: Copy KB webview resources to out-build
        with:
          charsetType: UTF_8
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/copy-kbblocks.ps1'
        shell: powershell
      - 
        # ---------- 5.0 构建能力插件（dist/extension.js） ----------
        name: Transpile plugins
        with:
          charsetType: UTF_8
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/transpile-plugins.ps1'
        shell: powershell
      - 
        name: Compile extensions
        with:
          charsetType: UTF_8
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/compile-extensions.ps1'
        shell: powershell
      - 
        name: Package vscode-win32-x64
        with:
          charsetType: UTF_8
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/package-vscode.ps1'
        shell: powershell
      - 
        # ---------- 6.4 下载并内置 ffmpeg（vox 口播视频可选依赖，失败不阻断） ----------
        name: Bundle ffmpeg
        with:
          charsetType: UTF_8
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/bundle-ffmpeg.ps1'
        shell: powershell
      - 
        # ---------- 6.4b 下载并内置 whisper.cpp（本地 ASR：video_analyze 口播转写，可选依赖，失败不阻断） ----------
        # 与 ffmpeg 同级策略；CI 无法访问 GitHub/HuggingFace 时用 SAROS_WHISPER_URL /
        # SAROS_WHISPER_MODEL_URL 指向内网镜像。
        name: Bundle whisper
        with:
          charsetType: UTF_8
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/bundle-whisper.ps1'
        shell: powershell
      - 
        # ---------- 6.5 打包产物关键构件验证 ----------
        name: Verify staging contents
        with:
          charsetType: UTF_8
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/verify-staging.ps1'
        shell: powershell
      - 
        name: Generate EXE installers (selected targets)
        with:
          charsetType: UTF_8
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/generate-exe.ps1'
        shell: powershell
      - name: Archive installers
        id: Rz97AF
        uses: UploadArtifactory@8.*
        with:
          filePath: .build/win32-x64/**/*.exe
          downloadFiles: "[{\"path\":\"\",\"param\":\"\"}]"
      - name: Upload installers to update server
        id: hgg5hu
        with:
          charsetType: UTF_8
        run: ' powershell -ExecutionPolicy Bypass -File deploy-package/scripts/bk-pipeline-upload.ps1'
        shell: powershell
      - 
        # ---------- 7.0 创建 Release：changelog + git tag + woa.git/GitHub 双端 ----------
        name: Create release (tag + changelog + woa.git/GitHub)
        with:
          charsetType: UTF_8
        run: ' powershell -ExecutionPolicy Bypass -File .ci/scripts/create-release.ps1'
        shell: powershell
      - name: Archive size reports and upload receipts
        uses: UploadArtifactory@8.*
        with:
          filePath: .build/pack-reports/**/*.json
          downloadFiles: "[{\"path\":\"\",\"param\":\"\"}]"
concurrency: {}
syntax-dialect: INHERIT
