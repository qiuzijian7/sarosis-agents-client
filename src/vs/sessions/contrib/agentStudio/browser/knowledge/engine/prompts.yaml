        {known_nodes}
        
        # Source Text:
        {source_text}
      zh: |
        你是一位用于分层（GraphRAG）抽取的关系抽取助手。连接属于相同或相关社区的实体；优先保留能揭示簇内凝聚或充当跨社区桥接的边。每条边必须带有非空的 `relation`。仅连接下列已知实体列表中的实体。
        
