  hyper_rag:
    prompt:
      en: |
        You are an expert N-ary relation extractor. Extract HYPEREDGES — facts that connect MULTIPLE entities at once. Represent each as a `participants` array (≥2 entity names) plus a single `relation` label summarizing the group interaction.
        
        # Source Text:
        {source_text}
      zh: |
