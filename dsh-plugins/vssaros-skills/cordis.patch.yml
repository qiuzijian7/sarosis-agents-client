# @vssaros/dsh-skills bundle patch: insert the skills row.
#
# Page route is registered as the loader prefix `/x/skills` (no trailing slash — a prefix route
# matches `p` and `p/<anything>`); the manifest keeps `/x/skills/` because that is the URL VsSaros loads.
#
# `config.dataRoot` / `config.skillsRoot` stay empty on purpose: without them the plugin reads
# `<dataRoot>/skills` with dataRoot defaulting to `~/.vssaros`. VsSaros injects the real data root
# through a `--patch` overlay targeting this id when the IDE data root is customized (same mechanism
# the vssaros-bridge and vssaros-kanban rows use).
#
# 容器说明：本模块与 @vssaros/dsh-mcp **共容器**（agentStudio.integration，方案 6.11.5 决议①）：
# 清单仍 1 插件 : 1 容器，容器的可见性由 VsSaros 侧聚合表按"已激活模块集合"计算。
- insert:
    - id: vssaros-skills
      name: '@vssaros/dsh-skills'
      config:
        # ★ 2026-10-19：**技能自动加载**（等价于 dsh 官方没有的 `activation: always`）。
        #   会话首轮把这些技能的**完整正文**注入 user 消息 ⇒ 不再依赖模型自觉去调 `skill` 工具
        #   （实测几百个会话里 `skill` 从未被主动调用）。
        #   ⚠ 代价：每个技能正文常驻上下文（help-me-understand ≈ 3.6 KB ≈ 900 tokens/轮）。
        #     只放"不读就会做错"的技能；**置空数组 = 完全不介入**（零开销 ✓）。
        #   ⚠ 为什么是这里而不是 agent 的 `skills:` 字段：那个字段在 dsh 侧**根本不生效**
        #     （`toPresetDefinition` 只消费 persona/tools/model/memory，skills 被忽略）。
        skillAutoload:
          - help-me-understand
# ── host 平面的 `tool-skill` **保持随包层的 disabled: true**（2026-11-02 撤回 10-12 那条翻转）─────────
# 10-12 这里写过 `- id: tool-skill / disabled: false`（当时 agent preset 里还没有 tool-skill 行）。
# 10-25 起我们的 preset 从官方 standard 基座生成、**自带** tool-skill ⇒ 两份实例同时活着：
#   · H = host 平面那份：`skill` 注册在**全局**层，pre-step 监听不带作用域（收所有 agent 的事件）；
#   · P = preset 那份：`skill` 注册在 preset 作用域层（agent 作用域的父级），监听挂在 preset 作用域。
#   `tools.get('skill', agent)` = 全局层被祖先层覆盖 ⇒ 返回 **P** ⇒ H 判"自己的工具不可见"⇒ 快照当空；
#   而 H 注册得早 ⇒ 在 waterfall 里是**外层**，在 P 发完目录之后执行，命中 dsh-tool-skill 的
#   `!history.published && skills.length === 0 ⇒ 删掉现有 skill-catalog 消息` 分支 ⇒ **P 发的目录被 H 删掉**。
#   真机表现：10-28 以来所有 vssaros-* 会话 skill-catalog 都是 0 条，模型"看不到任何技能"（含 Office 7 个）。
# ⇒ 与上游设计一致：技能机制（skill-filesystem / tool-skill）只在 preset 里，host 平面这两行保持关闭。
#   ⚠ 别再把它翻回来；需要"原生 skill 工具在不在"的诊断，请按 agent 作用域查（`tools.get('skill', agent)`）。
