# @vssaros/dsh-kb bundle patch: insert the knowledge-base row.
#
# 本模块是 `agentStudio.knowledgeBase` 容器的**宿主**（容器显示名「知识库」）：
#   - 自托管页面 `/x/kb`（清单 view.kind=page），只提供知识库自己的界面；
#   - 只读工具 `kb_list` / `kb_search` / `kb_read`。
#
# ★ 2026-10-12（「资料库」拆分）：本页原先**内嵌** memory 模块的片段 `/x/memory/section`
#   （决议① kb / memory 共容器）。记忆升为独立工作台后（`agentStudio.memory`，页面 `/x/memory/`），
#   内嵌与那条片段路由已一并删除 ⇒ 现在本容器的可见性**只由 kb 决定**。
#
# 数据：`~/.vssaros/knowledge-base/<vaultId>/`（`笔记/`、`库/<分类>/*.md`、`.kbkernel.json` 索引）。
# **只读**：写入/ingest 仍由 IDE 侧负责（本模块不声明 `owns`，不开直写通道）。
#
# `config.kbRoot` 留空时走 `<数据根>/knowledge-base`；VsSaros 侧若改过资料库存储位置
# （`agentStudio.knowledge.storage.path`），经 `--patch` 注入本行。
- insert:
    - id: vssaros-kb
      name: '@vssaros/dsh-kb'
      config:
        # ★ 2026-10-19（用户报「kb 工具每次都要授权，想加白名单」）：
        #   **免审白名单** —— 点名的工具**不再弹审批卡**（默认空 = 每次都问，与从前一样 ✓）。
        #
        # 为什么只放这两个：
        #   · `kb_mkdir` / `kb_write_note` 是"**在笔记区内正常写盘**"的动作，且内层**路径校验仍然照跑**
        #     （往只读的「库」区写会被工具自己拒绝，与审批无关）⇒ 放行的是"信任它在合法位置写"，不是"允许乱写"；
        #   · **不要**把 `kb_organize`（移动/删除）、`kb_feishu_sync`（写远端）、飞书评论加进来 ——
        #     那几类会改结构或在**别人可见的地方**留下内容，属于需要人确认的动作。
        # ★ 2026-10-19 扩到「本地 kb 工具全放」（用户要求：kb 相关工具都别每次弹）。
        #   共同点：**只动 <vault>/笔记/ 之内**，且内层路径校验照跑（往只读的「库」区写会被工具自己拒 ✓）。
        autoApprove:
          - kb_mkdir
          - kb_write_note
          - kb_mindmap        # 起只读子代理读笔记，写回同目录 .canvas（会覆盖同名）
          - kb_build          # 把「库」素材构建成「笔记」（只读库区、只写笔记区）
          - kb_reindex        # 重建 .kvindex（读笔记、写索引文件）
          - kb_organize       # 移动/复制/新建/删除（删除=移入 vault 外备份，可还原）
        # ⚠ **刻意不放**（它们写到**远端**或**别人可见的地方**，属于必须人确认的动作）：
        #   kb_feishu_sync / kb_feishu_spaces / feishu_drive_add_comment / feishu_drive_reply_comment
        #   真要一起放，把它们加进上面的列表即可（服务端逻辑不用改）。

