# @vssaros/dsh-parallel bundle patch: insert the parallel workbench row.
#
# 一个工作台编排 N 个并行 LLM 会话：每格是一个**真 TUI**（Host 侧 node-pty 起社区 `@tomowang/dsh-tui`，
# 原始 ANSI 流推到页面、浏览器端 xterm.js 渲染 ⇒ 颜色完整）。
#
# ★ 进程模型（2026-10-22 实测，见 doc/dsh-tui-ecosystem-research.md §7）：
#   · 社区 TUI 是**自带 core 的独立 dsh 进程**（不起 Host、不连 Host）⇒ N 格 = N 个独立进程；
#   · 同一 profile 多实例**可同时运行**；写锁是**会话目录级** ⇒ 不同格并行无冲突，同一会话只能一个写者；
#   · 每格内存 ≈ 71.6MB（带我们全套模块的空闲态）⇒ 12 格 ≈ 0.86GB。
#   · ⚠ Windows ConPTY 下 node-pty 的 pid 是 0 ⇒ 关格必须 `pty.kill()` / 关句柄，不能按 pid 杀。
#
# ⚠ 官方 `remote.terminal` **不用于** TUI 格：它的下行是"纯文本屏幕快照"（无 ANSI 样式）⇒ TUI 的颜色会全丢。
#   它仍可用于"会话内普通 shell"。
#
# 0.2.0 起格位后端已接：Host 侧 node-pty 起进程，原始 ANSI 流经 SSE 推到页面（浏览器端去 ANSI 显示，
# xterm.js 的颜色渲染下一步接）。0.1.x 只有静态网格壳。
#
# config 口径：
#   maxCells     同屏上限（默认 12；每格 ≈71.6MB ⇒ 12 格 ≈0.86GB）
#   tuiCommand   格子进程的可执行文件（默认 `dsh`）。⚠ 社区 TUI 要 dsh **0.2.1-rc.2** ⇒
#                想用独立的 rc.2 runtime 时把这里指到它的 bin，别动 dev Host 自己的 runtime。
#   tuiArgs      默认 ['--profile','tui']（需先在那个 profile 里 `dsh plugin add @tomowang/dsh-tui`）
#   tuiHome      格子进程的 DSH_HOME（默认继承 Host；指到一次性 home 可避免与 dev 会话互相占用写锁）
#   tuiCwd       格子进程的 cwd（默认 Host 的 cwd）
- insert:
    - id: vssaros-parallel
      name: '@vssaros/dsh-parallel'
      config:
        maxCells: 12
        tuiCommand: dsh
        tuiArgs:
          - '--profile'
          - 'tui'
