	:root {
		--bg: #1e1e1e; --panel: #252526; --panel2: #2b2b2d; --line: #3c3c3c;

	}
	* { box-sizing: border-box; }
	html, body { height: 100%; }
	body { margin: 0; background: #141414; color: var(--fg);
		font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
		display: flex; flex-direction: column; }

	/* ── 演示外壳（不属于 KIT）── */
	.topbar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
		padding: 9px 16px; border-bottom: 1px solid #2a2a2a; background: #1a1a1a; }
	.topbar h1 { font-size: 14px; margin: 0; font-weight: 600; }
	.topbar .grow { flex: 1; }
	.hostswitch { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
	.hostswitch button { height: 26px; padding: 0 12px; font-size: 11.5px; border: 0;

	.hostswitch button.on { background: #0e639c; color: #fff; }
	.hostswitch button + button { border-left: 1px solid var(--line); }
	.ribbon { flex: 0 0 auto; padding: 6px 16px; font-size: 11px; color: #9fc0ff;
		background: #1b2530; border-bottom: 1px solid #253544; line-height: 1.6; }
	.ribbon b { color: #cfe0ff; }
	.ribbon code { color: #b9d4ff; }

	/* ── 三栏骨架（两个宿主一致，只有容器不同）── */
	.app { flex: 1; display: flex; min-height: 0; position: relative; }
	.app.ide { padding: 0; }
	.col-left { width: var(--w-left); flex: 0 0 auto; display: flex; flex-direction: column;
		background: var(--panel); border-right: 1px solid var(--line); }
	.col-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
	.col-right { width: var(--w-right); flex: 0 0 auto; display: flex; flex-direction: column;

	.k-list { flex: 1; overflow: auto; }
	.k-grp { display: flex; align-items: center; gap: 6px; padding: 6px 10px 3px;
		font-size: 10.5px; color: var(--fg-faint); }
	.k-grp .n { background: #333; border-radius: 8px; padding: 0 5px; font-size: 10px; }

	.k-li.on { background: #2f3542; border-left-color: var(--accent); }
	.k-li.dim { opacity: .55; }
	.k-li .ic { width: 18px; text-align: center; }
	.k-li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

	.k-badge.warn { background: #3a3320; color: #e0bf7a; }

	.k-row .v { flex: 1; min-width: 0; }

	.k-hint { color: var(--fg-faint); font-size: 10.5px; margin-top: 4px; line-height: 1.5; }
	.k-note { font-size: 11px; padding: 7px 10px; border-radius: 4px; margin: 8px 0; line-height: 1.55; }
	.k-note.warn { border: 1px solid #3a3320; background: #2a2618; color: #e0bf7a; }
	.k-note.ok { border: 1px solid #234a2b; background: #1b2a1e; color: #8fd39b; }
	.k-note.info { border: 1px solid #253544; background: #1b2530; color: #9fc0ff; }

	.k-card .hd { font-size: 10.5px; color: var(--fg-faint); letter-spacing: .04em; margin-bottom: 8px; }
	.k-empty { color: var(--fg-faint); font-size: 11.5px; padding: 10px 0; }
	.k-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-top: 6px; }
	.k-grid3 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-top: 6px; }
	.k-grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-top: 6px; }

	.k-tl.off { color: var(--fg-faint); }

	.cs-body { flex: 1; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }

		border: 1px solid #24384a; border-radius: 4px; padding: 3px 8px; }
	.tool .t { color: var(--fg-faint); margin-left: 6px; }
	.cs-composer { border-top: 1px solid var(--line); padding: 9px 12px 10px; background: #1b1b1b; }
	.cs-input { border: 1px solid var(--line); border-radius: 6px; background: #202022;
		padding: 8px 10px; font-size: 11.5px; color: var(--fg-faint); }
	.cs-acts { display: flex; align-items: center; gap: 6px; margin-top: 7px; }
	.cs-acts .sp { flex: 1; }
	.cs-hostnote { font-size: 10px; color: var(--fg-faint); margin-top: 6px; line-height: 1.5; }

	/* dsh 宿主：顶级页签的整页视图（用量/委派/授权）*/
	.dsh-full { flex: 1; overflow: auto; padding: 14px 18px 26px; }
</style>

function esc(s) {

			+ '<div class="b"><div class="meta">' + esc(name) + ' · ' + esc(m.when || '') + '</div>' + esc(m.text) + '</div></div>';

	return '<div class="cs">'
		+ '<div class="cs-hd">'
		+ '<span style="font-size:13px">' + o.icon + '</span><b>' + esc(o.name) + '</b>'

		+ '<button class="k-btn ghost">＋</button><button class="k-btn ghost">/ 命令</button>'

		+ '<input class="k-search" id="search" placeholder="搜索名称 / id / 技能…" value="' + esc(state.query) + '">'
		+ '<div class="k-list">'
		+ grpHead('已注册', reg.length) + (reg.map(listItem).join('') || '<div class="k-empty" style="padding-left:12px">无匹配</div>')
		+ grpHead('未注册', unreg.length) + unreg.map(listItem).join('')
		+ grpHead('群聊', grps.length) + (grps.map(listItem).join('') || '<div class="k-empty" style="padding-left:12px">无</div>')
		+ '</div>'
		+ '<div class="k-foot"><button class="k-btn pri" id="btn-new-bot">＋ Bot</button><button class="k-btn" id="btn-new-group">＋ 群聊</button></div>'
		+ '</div>';
}

function rightBody(o) {
	if (o.isGroup) {
		return state.rightTab === 'ginfo' ? blockGroupInfo(o)
			: state.rightTab === 'policy' ? blockGroupPolicy(o)
				: blockSessions(o);
	}
	const others = Object.values(DATA.agents).filter((x) => x.id !== o.id && x.userFacing);
	switch (state.rightTab) {
		case 'overview': return blockIdentity(o) + sec('欢迎卡') + blockWelcome(o);
		case 'persona': return blockPersona(o);
		case 'tools': return blockTools(o);
		case 'memory': return blockMemory(o);
		case 'assign': return blockAssign(o, others);
		case 'sessions': return blockSessions(o);
		default: return blockVersions(o);
	}
}

function colRight(o) {
	const dirty = state.dirty[state.selected] ? ' show' : '';
	return '<div class="col-right">'
		+ '<div class="k-bar"><span>' + (isGroup() ? '群聊' : (o.source === 'custom' ? '自定义 bot' : '内置 bot')) + '</span>'
		+ '<span class="k-dirty' + dirty + '">●</span>'
		+ '<span class="sp"></span>'
		+ '<button class="k-btn ghost" id="btn-save" title="保存（内置只读时不可用）">保存</button>'
		+ '</div>'
		+ '<div class="k-tabs">' + tabBar(tabsOf(), state.rightTab) + '</div>'
		+ '<div class="k-body">' + rightBody(o) + '</div>'
		+ '</div>';
}

/* dsh 的全局页签（不进入三栏） */
function dshGlobal(tab) {
	if (tab === 'usage') {
		return '<div class="dsh-full">' + sec('用量（近 7 天）')
			+ '<table class="k-tb"><tr><th>bot</th><th>会话</th><th>回合</th><th>tokens</th><th>最近</th></tr>'
			+ Object.values(DATA.agents).map((a) => '<tr><td>' + a.icon + ' ' + esc(a.name) + '</td><td>' + a.usage.sessions
				+ '</td><td>' + a.usage.turns + '</td><td>' + a.usage.tokens + '</td><td style="color:var(--fg-faint)">' + a.usage.last + '</td></tr>').join('')
			+ '</table></div>';
	}
	if (tab === 'assign') {
		const bots = Object.values(DATA.agents).filter((a) => a.userFacing);
		return '<div class="dsh-full">' + sec('委派矩阵（行 = 发起，列 = 目标）')
			+ '<table class="k-tb"><tr><th>发起</th>' + bots.map((b) => '<th>' + b.icon + '</th>').join('') + '</tr>'
			+ bots.map((f) => '<tr><td>' + f.icon + ' ' + esc(f.name) + '</td>'
				+ bots.map((t) => '<td style="text-align:center">' + (f.assign.canDelegateTo.includes(t.id) ? '<span style="color:#8fd39b">✓</span>' : '<span style="color:#555">·</span>') + '</td>').join('')
				+ '</tr>').join('') + '</table></div>';
	}
	return '<div class="dsh-full">' + sec('审批模板')
		+ '<div class="k-li2">' + chip('已启用', 'ok') + '<span>写文件到 <code>src/**</code></span></div>'
		+ '<div class="k-li2">' + chip('已启用', 'ok') + '<span>执行 <code>pwsh</code></span></div>'
		+ sec('发件箱')
		+ '<div class="k-li2">' + chip('待处理', 'warn') + '<span>把 code-reviewer 设为可委派</span></div>'
		+ note('授权/用量是<b>全局</b>的：dsh 侧是顶级页签，IDE 侧只能做独立编辑器 Tab。', 'info') + '</div>';
}

/* ══════════════════════════════════════════════════════════════════════════
 * 渲染
 * ══════════════════════════════════════════════════════════════════════════ */
function render() {
	const o = cur();
	if (!tabsOf().some((t) => t.k === state.rightTab)) { state.rightTab = tabsOf()[0].k; }

	/* 顶部 ribbon：讲清两个宿主的容器差异（同一套三栏）*/
	const ribbon = state.host === 'dsh'
		? '<b>dsh 窗口</b>：三栏都在工作台页里 —— 左 名册 · 中 <b>chat-surface</b> · 右 详情页签；'
			+ '「用量 / 委派 / 授权」是<b>顶级页签</b>，切走后整页替换三栏。'
		: '<b>IDE</b>：左栏进 <b>sideview</b>（Activity Bar 视图），中栏 + 右栏进 <b>编辑器区</b>'
			+ '（编辑区分左右两组，中间是该 bot 的 chat-surface 会话）。组件与 dsh 侧完全相同，只差容器。';
	document.getElementById('ribbon').innerHTML = ribbon;

	let html = '';
	if (state.host === 'dsh') {
		html = (state.dshTab === 'roster')
			? colLeft() + '<div class="col-mid">' + chatSurface(o) + '</div>' + colRight(o)
			: dshGlobal(state.dshTab);
	} else {
		html = colLeft() + '<div class="col-mid">' + chatSurface(o) + '</div>' + colRight(o);
	}

	/* dsh 侧多一条顶级页签栏 */
	if (state.host === 'dsh') {
		html = '<div style="display:flex;flex-direction:column;flex:1;min-height:0">'
			+ '<div class="k-tabs">' + TABS_DSH.map((t) => '<div class="k-tab' + (state.dshTab === t.k ? ' on' : '') + '" data-dshtab="' + t.k + '">' + esc(t.label) + '</div>').join('') + '</div>'
			+ '<div style="display:flex;flex:1;min-height:0">' + html + '</div></div>';
	}

	document.getElementById('app').innerHTML = html;
	document.getElementById('host-dsh').classList.toggle('on', state.host === 'dsh');
	document.getElementById('host-ide').classList.toggle('on', state.host === 'ide');
	bind(o);
}

function bind(o) {
	const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) { el.addEventListener(ev, fn); } };
	on('search', 'input', (e) => { state.query = e.target.value; render(); });

	document.querySelectorAll('[data-sel]').forEach((el) => {
		el.onclick = () => { state.selected = el.getAttribute('data-sel'); state.rightTab = tabsOf()[0].k; render(); };
	});
	document.querySelectorAll('[data-tab]').forEach((el) => {
		el.onclick = () => { state.rightTab = el.getAttribute('data-tab'); render(); };
	});
	document.querySelectorAll('[data-dshtab]').forEach((el) => {
		el.onclick = () => { state.dshTab = el.getAttribute('data-dshtab'); render(); };
	});

	on('btn-use', 'click', () => toast('已切到「' + o.name + '」开聊（POST /x/agents/api/persona，会话继续）'));
	on('btn-newtalk', 'click', () => toast('真实实现：新开一条会话（chat-surface 自带）'));
	on('btn-save', 'click', () => { state.dirty[state.selected] = false; toast('已保存（mockup 示意）'); });
	on('btn-new-bot', 'click', () => toast('真实实现：新建 bot'));
	on('btn-new-group', 'click', () => toast('真实实现：新建群聊'));

	if (!o.isGroup) {
		on('ov-name', 'input', (e) => { o.name = e.target.value; markDirty(); });
		on('ov-role', 'input', (e) => { o.role = e.target.value; markDirty(); });
		on('ov-desc', 'input', (e) => { o.desc = e.target.value; markDirty(); });
		on('ov-model', 'input', (e) => { o.model = e.target.value; markDirty(); });
		on('ta-persona', 'input', (e) => { o.persona = e.target.value; markDirty(); });
		[0, 1, 2].forEach((i) => on('sug-' + i, 'input', (e) => {
			const arr = (o.suggestions || []).slice();
			while (arr.length < 3) { arr.push(''); }
			arr[i] = e.target.value;
			o.suggestions = arr;
			markDirty();
		}));
		on('mem-chars', 'input', (e) => {
			o.memory.chars = Number(e.target.value);
			const v = document.getElementById('mem-chars-val');
			if (v) { v.textContent = e.target.value; }
			markDirty();
		});
		document.querySelectorAll('input[name=memmode]').forEach((el) => {
			el.onchange = () => { o.memory.mode = el.value; markDirty(); };
		});
	} else {
		on('g-name', 'input', (e) => { o.name = e.target.value; markDirty(); });
		document.querySelectorAll('input[name=gmode]').forEach((el) => {
			el.onchange = () => { o.mode = el.value; markDirty(); };
		});
	}

	document.querySelectorAll('[data-act]').forEach((el) => {
		el.onclick = () => {
			const act = el.getAttribute('data-act');
			toast({
				'mem-append': '已追加 2 条到 MEMORY.md',
				'mem-snapshot': '已记快照 mem-2026-10-27',
				'open-session': '真实实现：在聊天里继续这条会话',
				'invite': '真实实现：成员选择器（invite）',
				'policy': '已切换该成员策略（policy）',
			}[act] || '（示意）');
		};
	});
}

document.getElementById('host-dsh').onclick = () => { state.host = 'dsh'; render(); };
document.getElementById('host-ide').onclick = () => { state.host = 'ide'; render(); };
document.getElementById('btn-reset').onclick = () => {
	DATA.agents = clone(AGENTS); DATA.groups = clone(GROUPS);
	for (const [id, list] of Object.entries(CHAT)) {
		if (DATA.agents[id]) { DATA.agents[id].chat = list; }
		if (DATA.groups[id]) { DATA.groups[id].chat = list; }
	}
	state.dirty = {}; state.selected = 'coder'; state.rightTab = 'overview';
	state.dshTab = 'roster'; state.query = '';
	toast('已重置');
};
render();
</script>
</body>
</html>
