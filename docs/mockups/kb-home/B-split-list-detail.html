<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>B · 左列表 + 右详情（独立主页）· Mockup</title>
<style>
  :root[data-theme="dark"]{--bg:#15161a;--panel:#1c1d22;--panel2:#22232a;--panel3:#282a32;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.18);--fg:#e8e9ec;--fg2:#a9abb3;--fg3:#71737c;--accent:#5b8cff;--accent2:#7aa2ff;--ok:#3fb950;--warn:#d29922;--shadow:0 8px 24px rgba(0,0,0,.45)}
  :root[data-theme="light"]{--bg:#f5f6f8;--panel:#fff;--panel2:#f0f2f5;--panel3:#e7ebf1;--line:rgba(0,0,0,.09);--line2:rgba(0,0,0,.17);--fg:#1b1d22;--fg2:#5a5e68;--fg3:#8b8f99;--accent:#2f6bff;--accent2:#4b80ff;--ok:#1a7f37;--warn:#bf8700;--shadow:0 8px 22px rgba(20,30,60,.12)}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit;color:inherit}
  .top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px)}
  .home{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;color:var(--accent2);background:color-mix(in srgb,var(--accent) 16%,transparent)}
  .crumb{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
  .grow{flex:1}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;color:var(--fg2)}
  .iconbtn:hover{background:var(--panel2);color:var(--fg)}
  .btn{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);font-size:12.5px}
  .btn:hover{background:var(--panel3)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  .split{flex:1;display:flex;min-height:0}

  /* 左：库列表 */
  .side{width:274px;flex:0 0 274px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);min-height:0}
  .side .head{padding:10px 10px 8px;border-bottom:1px solid var(--line)}
  .search{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
  .search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:12.5px}
  .side .newbtn{width:100%;height:28px;border-radius:7px;border:1.5px dashed var(--line2);color:var(--fg2);font-size:12px}
  .side .newbtn:hover{border-color:var(--accent);color:var(--accent2);background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .list{flex:1;overflow:auto;padding:6px}
  .item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 8px;border-radius:7px;font-size:12.5px;color:var(--fg2)}
  .item:hover{background:var(--panel2);color:var(--fg)}
  .item.sel{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--fg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
  .item .dot{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
  .item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .n{font-size:11px;color:var(--fg3);flex:0 0 auto}
  .item .fb{font-size:10.5px;color:var(--ok);flex:0 0 auto}

  /* 右：详情 */
  .main{flex:1;min-width:0;overflow:auto;padding:22px 26px 60px}
  .hero{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
  .avatar{width:52px;height:52px;border-radius:12px;flex:0 0 52px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;background:var(--panel3)}
  .hero h1{margin:0 0 3px;font-size:19px;font-weight:650;letter-spacing:.2px}
  .hero .desc{font-size:12.5px;color:var(--fg3)}
  .hero .acts{margin-left:auto;display:flex;gap:8px;flex:0 0 auto}
  .chips{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .chip{font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--fg3)}
  .chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
  .chip.accent{color:var(--accent2);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}

  .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}
  @media (max-width:820px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .kpi{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .kpi .lb{font-size:11.5px;color:var(--fg3)}
  .kpi .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
  .kpi .v small{font-size:11px;color:var(--fg3);font-weight:500;margin-left:2px}

  h2.sec{font-size:13px;margin:0 0 8px;color:var(--fg2);font-weight:600}
  .docs{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);margin-bottom:20px}
  .drow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-top:1px solid var(--line);font-size:12.5px}
  .drow:first-child{border-top:0}
  .drow:hover{background:var(--panel2)}
  .drow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .drow .tm{font-size:11.5px;color:var(--fg3);flex:0 0 70px;text-align:right}
  .empty{padding:22px;text-align:center;color:var(--fg3);font-size:12px}

  .mask{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
  .mask.on{display:flex}
  .modal{width:420px;max-width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden}
  .modal header{padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
  .modal .body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;color:var(--fg2)}
  .field input{padding:8px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);outline:none;font-size:12.5px}
  .field input:focus{border-color:var(--accent)}
  .modal footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:var(--panel3);border:1px solid var(--line2);padding:8px 14px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:80}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="top">
  <div class="crumb"><span class="home">🏠</span><span>知识库</span></div>
  <div class="grow"></div>
  <button class="btn primary" id="newTop">＋ 新建知识库</button>
  <button class="iconbtn" id="theme" title="切换明暗">☀</button>
</div>

<div class="split">
  <aside class="side">
    <div class="head">
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" opacity=".5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="搜索知识库…" />
      </div>
      <button class="newbtn" id="newSide">＋ 新建知识库</button>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <header>新建知识库</header>
    <div class="body">
      <div class="field"><label>名称</label><input id="vname" placeholder="例如：团队 UI 知识库" /></div>
      <div class="field"><label>关联飞书（可选）</label><input id="vspace" placeholder="wiki 空间 ID 或粘贴链接" /></div>
    </div>
    <footer><button class="btn" id="cancel">取消</button><button class="btn primary" id="ok">创建</button></footer>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

  let VAULTS = [
    { name:'01_学习', docs:76, assets:64, at:'2 分钟前', team:false, git:true, space:'AIAgent知识库', hue:262,
      desc:'AI / UE / 游戏设计的学习笔记与提炼',
      docs_list:[
        { n:'差分图压缩优化方案.md', t:'2 分钟前' },
        { n:'KB 主页设计要点.md', t:'今天 11:07' },
        { n:'飞书直读可行性结论.md', t:'今天 09:48' },
        { n:'UnrealGameplay框架笔记.md', t:'昨天' },
        { n:'游戏设计：新手引导拆解.md', t:'10-31' },
      ] },
    { name:'技术架构', docs:0, assets:3, at:'昨天', team:true, git:true, space:'', hue:210, desc:'系统设计与技术选型', docs_list:[] },
    { name:'导入', docs:0, assets:0, at:'3 天前', team:false, git:false, space:'', hue:190, desc:'外部导入的原始材料', docs_list:[] },
    { name:'02_工作', docs:0, assets:12, at:'上周', team:true, git:true, space:'', hue:288, desc:'周报 / 项目推进', docs_list:[] },
    { name:'03_生活', docs:0, assets:5, at:'10-20', team:false, git:true, space:'', hue:24, desc:'读书 / 旅行 / 杂记', docs_list:[] },
  ];
  let q = '', cur = VAULTS[0].name;

  const cover = (hue) => `linear-gradient(135deg, hsl(${hue} 45% 34%), hsl(${hue + 26} 38% 18%))`;

  function renderList() {
    const arr = VAULTS.filter(v => !q || v.name.toLowerCase().includes(q.toLowerCase()));
    $('#list').innerHTML = arr.map((v) => `
      <button class="item ${v.name === cur ? 'sel' : ''}" data-kb="${esc(v.name)}">
        <span class="dot" style="background:${cover(v.hue)}"></span>
        <span class="nm">${esc(v.name)}</span>
        <span class="n">${v.docs}</span>
        ${v.space ? '<span class="fb">🔗</span>' : ''}
      </button>`).join('') || '<div class="empty">没有匹配的知识库</div>';
  }

  function renderMain() {
    const v = VAULTS.find(x => x.name === cur) || VAULTS[0];
    if (!v) { $('#main').innerHTML = '<div class="empty">还没有知识库，先新建一个</div>'; return; }
    $('#main').innerHTML = `
      <div class="hero">
        <div class="avatar" style="background:${cover(v.hue)}">📚</div>
        <div style="min-width:0">
          <h1>${esc(v.name)}</h1>
          <div class="desc">${esc(v.desc || '（还没有说明）')}</div>
          <div class="chips">
            ${v.team ? '<span class="chip"]>团队可见</span>' : '<span class="chip">私有</span>'}
            ${v.git ? '<span class="chip ok">版本管理</span>' : '<span class="chip">未开启版本管理</span>'}
            ${v.space ? `<span class="chip accent">🔗 已关联飞书 · ${esc(v.space)}</span>` : '<span class="chip">未关联飞书</span>'}
          </div>
        </div>
        <div class="acts">
          <button class="btn" data-act="bind">${v.space ? '换绑飞书' : '关联飞书'}</button>
          <button class="btn primary" data-act="open">打开文件树 →</button>
        </div>
      </div>

      <div class="cards">
        <div class="kpi"><div class="lb">文档</div><div class="v">${v.docs}<small>篇</small></div></div>
        <div class="kpi"><div class="lb">素材</div><div class="v">${v.assets}<small>个</small></div></div>
        <div class="kpi"><div class="lb">最近更新</div><div class="v" style="font-size:13px;padding-top:4px">${esc(v.at)}</div></div>
        <div class="kpi"><div class="lb">飞书</div><div class="v" style="font-size:13px;padding-top:4px">${v.space ? '已绑定' : '未绑定'}</div></div>
      </div>

      <h2 class="sec">最近文档</h2>
      <div class="docs">
        ${v.docs_list.length ? v.docs_list.map((d) => `
          <button class="drow" data-doc="${esc(d.n)}">
            <span class="nm">${esc(d.n)}</span><span class="tm">${esc(d.t)}</span>
          </button>`).join('') : '<div class="empty">这个库还没有文档</div>'}
      </div>

      <h2 class="sec">快捷操作</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" data-act="newdoc">＋ 新建文档</button>
        <button class="btn" data-act="search">🔍 在库内搜索</button>
        <button class="btn" data-act="graph">🕸 打开图谱</button>
        <button class="btn" data-act="publish">📦 发布到商城</button>
      </div>`;
  }

  let tt = 0;
  const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800); };

  document.addEventListener('click', (e) => {
    const t = e.target;
    if (t.closest('#newTop') || t.closest('#newSide')) { $('#mask').classList.add('on'); setTimeout(() => $('#vname').focus(), 30); return; }
    if (t.closest('#cancel')) { $('#mask').classList.remove('on'); return; }
    if (t.closest('#ok')) {
      const name = $('#vname').value.trim();
      if (!name) { $('#vname').focus(); return; }
      const sp = $('#vspace').value.trim();
      VAULTS.unshift({ name, docs:0, assets:0, at:'刚刚', team:false, git:true, space: sp ? '新关联空间' : '', hue: Math.floor(Math.random() * 360), desc:'', docs_list:[] });
      cur = name;
      $('#mask').classList.remove('on'); $('#vname').value = ''; $('#vspace').value = '';
      renderList(); renderMain(); toast('已创建「' + name + '」');
      return;
    }
    const item = t.closest('[data-kb]');
    if (item) { cur = item.dataset.kb; renderList(); renderMain(); return; }
    const doc = t.closest('[data-doc]');
    if (doc) { toast('打开「' + doc.dataset.doc + '」（mock）'); return; }
    const act = t.closest('[data-act]');
    if (act) {
      const map = { bind:'关联/换绑飞书空间（mock）', open:'进入文件树（mock）', newdoc:'新建文档（mock）', search:'库内搜索（mock）', graph:'图谱（mock）', publish:'发布到商城（mock）' };
      toast(map[act.dataset.act] || 'mock');
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#mask').classList.remove('on'); });
  $('#q').addEventListener('input', (e) => { q = e.target.value; renderList(); });
  $('#theme').addEventListener('click', () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; });

  renderList(); renderMain();
})();
</script>
</body>
</html>
