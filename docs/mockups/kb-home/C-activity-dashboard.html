<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>C · 活动仪表盘（独立主页）· Mockup</title>
<style>
  :root[data-theme="dark"]{--bg:#15161a;--panel:#1c1d22;--panel2:#22232a;--panel3:#282a32;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.18);--fg:#e8e9ec;--fg2:#a9abb3;--fg3:#71737c;--accent:#5b8cff;--accent2:#7aa2ff;--ok:#3fb950;--warn:#d29922;--danger:#f85149;--shadow:0 8px 24px rgba(0,0,0,.45)}
  :root[data-theme="light"]{--bg:#f5f6f8;--panel:#fff;--panel2:#f0f2f5;--panel3:#e7ebf1;--line:rgba(0,0,0,.09);--line2:rgba(0,0,0,.17);--fg:#1b1d22;--fg2:#5a5e68;--fg3:#8b8f99;--accent:#2f6bff;--accent2:#4b80ff;--ok:#1a7f37;--warn:#bf8700;--danger:#cf222e;--shadow:0 8px 22px rgba(20,30,60,.12)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit;color:inherit}
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .home{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;color:var(--accent2);background:color-mix(in srgb,var(--accent) 16%,transparent)}
  .crumb{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
  .grow{flex:1}
  .search{display:flex;align-items:center;gap:6px;height:30px;padding:0 9px;border-radius:8px;background:var(--panel);border:1px solid var(--line);min-width:200px}
  .search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:12.5px}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;color:var(--fg2)}
  .iconbtn:hover{background:var(--panel2);color:var(--fg)}
  .btn{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);font-size:12.5px}
  .btn:hover{background:var(--panel3)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  .wrap{max-width:1160px;margin:0 auto;padding:22px 20px 70px}

  /* 顶部问候 + 大数字 */
  .hello{display:flex;align-items:flex-end;gap:18px;margin-bottom:18px;flex-wrap:wrap}
  .hello h1{margin:0;font-size:20px;font-weight:650}
  .hello .sub{font-size:12.5px;color:var(--fg3);margin-top:2px}
  .big{margin-left:auto;display:flex;gap:22px}
  .big .n{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
  .big .n small{font-size:12px;color:var(--fg3);font-weight:500;margin-left:3px}
  .big .l{font-size:11.5px;color:var(--fg3)}
  .big .up{color:var(--ok);font-size:11.5px}

  /* 两栏：左活动流 / 右库卡片 */
  .cols{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
  @media (max-width:920px){.cols{grid-template-columns:1fr}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .panel .hd{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600}
  .panel .hd .grow{flex:1}
  .panel .hd .mini{font-size:11px;font-weight:500;color:var(--fg3)}
  .panel .bd{padding:8px 8px 12px}

  .day{padding:6px 6px 2px;font-size:11px;color:var(--fg3);display:flex;align-items:center;gap:7px}
  .day::after{content:"";flex:1;height:1px;background:var(--line)}
  .ev{display:flex;gap:9px;width:100%;text-align:left;padding:7px 8px;border-radius:8px;align-items:flex-start}
  .ev:hover{background:var(--panel2)}
  .ev .ic{flex:0 0 22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent2);margin-top:1px}
  .ev .ic.mod{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
  .ev .ic.sync{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
  .ev .tt{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev .mt{font-size:11px;color:var(--fg3);display:flex;gap:6px;flex-wrap:wrap}
  .ev .tm{margin-left:auto;font-size:11px;color:var(--fg3);flex:0 0 auto}

  /* 右侧库卡片（紧凑双列） */
  .kbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
  .kb{position:relative;text-align:left;border-radius:9px;border:1px solid var(--line);background:var(--panel2);padding:9px 10px;transition:.15s;overflow:hidden}
  .kb:hover{transform:translateY(-1px);border-color:var(--line2);box-shadow:var(--shadow)}
  .kb .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kb .mt{font-size:11px;color:var(--fg3);display:flex;gap:5px;margin-top:2px}
  .kb .fb{position:absolute;right:8px;top:8px;font-size:10.5px;color:var(--ok)}
  .kb .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.8}
  .kb.new{display:flex;align-items:center;justify-content:center;gap:5px;border:1.5px dashed var(--line2);background:transparent;color:var(--fg2);font-size:12px;min-height:56px}
  .kb.new:hover{border-color:var(--accent);color:var(--accent2)}

  /* 底部：飞书绑定 + 素材占用 */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  @media (max-width:920px){.two{grid-template-columns:1fr}}
  .line{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px}
  .line:first-child{border-top:0}
  .line .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .line .st{font-size:11px;color:var(--fg3)}
  .line .st.ok{color:var(--ok)}
  .meter{height:4px;border-radius:3px;background:var(--panel3);overflow:hidden;margin-top:5px}
  .meter i{display:block;height:100%;background:var(--warn)}

  .mask{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
  .mask.on{display:flex}
  .modal{width:420px;max-width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:14px;overflow:hidden}
  .modal header{padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
  .modal .body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;color:var(--fg2)}
  .field input{padding:8px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);outline:none;font-size:12.5px}
  .modal footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:var(--panel3);border:1px solid var(--line2);padding:8px 14px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:80}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="top">
  <div class="crumb"><span class="home">🏠</span><span>知识库</span></div>
  <div class="grow"></div>
  <div class="search"><input id="q" placeholder="搜索知识库…" /></div>
  <button class="btn primary" id="newTop">＋ 新建</button>
  <button class="iconbtn" id="theme" title="切换明暗">☀</button>
</div>

<div class="wrap">
  <div class="hello">
    <div>
      <h1>下午好，子健</h1>
      <div class="sub">你有 <b id="kbN">5</b> 个知识库 · 本周动了 <b>12</b> 篇</div>
    </div>
    <div class="big">
      <div><div class="n" id="bigDocs">76<small>篇</small></div><div class="l">总文档</div></div>
      <div><div class="n" style="color:var(--ok)">+12</div><div class="l">本周新增 <span class="up">↑ 25%</span></div></div>
      <div><div class="n" id="bigSync">2<small>库</small></div><div class="l">已绑飞书</div></div>
    </div>
  </div>

  <div class="cols">
    <div class="panel">
      <div class="hd">本周活动<span class="grow"></span><span class="mini">近 7 天 · 14 条</span></div>
      <div class="bd" id="feed"></div>
    </div>

    <div>
      <div class="panel">
        <div class="hd">知识库<span class="grow"></span><span class="mini" id="kbCnt">5 个</span></div>
        <div class="kbs" id="kbs"></div>
      </div>
    </div>
  </div>

  <div class="two">
    <div class="panel">
      <div class="hd">飞书绑定</div>
      <div id="bindList"></div>
    </div>
    <div class="panel">
      <div class="hd">素材占用<span class="grow"></span><span class="mini">阈值 500 MB</span></div>
      <div style="padding:12px">
        <div style="font-size:12.5px">数据源/raw · <b>0.31 GB</b> / 500 MB</div>
        <div class="meter"><i style="width:64%"></i></div>
        <div style="font-size:11.5px;color:var(--warn);margin-top:6px">⚠ 本月 +182 MB（视频归档），接近阈值 · 建议 LFS / 外链</div>
      </div>
    </div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <header>新建知识库</header>
    <div class="body">
      <div class="field"><label>名称</label><input id="vname" placeholder="例如：团队 UI 知识库" /></div>
    </div>
    <footer><button class="btn" id="cancel">取消</button><button class="btn primary" id="ok">创建</button></footer>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

  let KBS = [
    { name:'01_学习', docs:76, space:'AIAgent知识库', hue:262 },
    { name:'技术架构', docs:0, space:'', hue:210 },
    { name:'导入', docs:0, space:'', hue:190 },
    { name:'02_工作', docs:0, space:'', hue:288 },
    { name:'03_生活', docs:0, space:'', hue:24 },
  ];
  const FEED = [
    { d:'今天', t:'14:32', k:'new', n:'差分图压缩优化方案.md', kb:'01_学习' },
    { d:'今天', t:'11:07', k:'new', n:'KB 主页设计要点.md', kb:'01_学习' },
    { d:'今天', t:'09:48', k:'mod', n:'飞书直读可行性结论.md', kb:'01_学习' },
    { d:'今天', t:'09:12', k:'sync', n:'同步到「AIAgent知识库」3 篇', kb:'01_学习' },
    { d:'昨天', t:'22:15', k:'mod', n:'版本管理：默认开启的取舍.md', kb:'01_学习' },
    { d:'昨天', t:'17:40', k:'new', n:'LFS 迁移踩坑.md', kb:'技术架构' },
    { d:'昨天', t:'10:22', k:'new', n:'素材清理清单.md', kb:'导入' },
    { d:'10-31', t:'20:05', k:'new', n:'周报 10/27-10/31.md', kb:'02_工作' },
    { d:'10-31', t:'16:31', k:'mod', n:'读书笔记：系统之美.md', kb:'03_生活' },
  ];

  const cover = (hue) => `linear-gradient(135deg, hsl(${hue} 45% 34%), hsl(${hue + 26} 38% 18%))`;
  const ICON = { new:'＋', mod:'✎', sync:'⇅' };

  function render() {
    const q = ($('#q').value || '').toLowerCase();
    const kbs = KBS.filter(k => !q || k.name.toLowerCase().includes(q));
    $('#kbN').textContent = KBS.length;
    $('#kbCnt').textContent = kbs.length + ' 个';
    $('#bigDocs').innerHTML = KBS.reduce((s, k) => s + k.docs, 0) + '<small>篇</small>';
    $('#bigSync').innerHTML = KBS.filter(k => k.space).length + '<small>库</small>';

    // 活动流（按天分组）
    let last = '';
    $('#feed').innerHTML = FEED.map((e) => {
      const head = e.d !== last ? (last = e.d, `<div class="day">${esc(e.d)}</div>`) : '';
      return head + `<button class="ev" data-ev="${esc(e.n)}">
        <span class="ic ${e.k === 'mod' ? 'mod' : e.k === 'sync' ? 'sync' : ''}">${ICON[e.k]}</span>
        <span style="min-width:0;flex:1">
          <span class="tt">${esc(e.n)}</span>
          <span class="mt"><span>${esc(e.kb)}</span><span>·</span><span>${e.k === 'mod' ? '修改' : e.k === 'sync' ? '同步' : '新增'}</span></span>
        </span>
        <span class="tm">${esc(e.t)}</span>
      </button>`;
    }).join('');

    $('#kbs').innerHTML = `
      <button class="kb new" id="newCard">＋ 新建知识库</button>` + kbs.map((k) => `
      <button class="kb" data-kb="${esc(k.name)}">
        <span class="bar" style="background:${cover(k.hue)}"></span>
        ${k.space ? '<span class="fb" title="已关联飞书">🔗</span>' : ''}
        <span class="nm">${esc(k.name)}</span>
        <span class="mt"><span>${k.docs} 篇</span></span>
      </button>`).join('');

    $('#bindList').innerHTML = KBS.map((k) => `
      <div class="line">
        <span class="nm">${esc(k.name)}</span>
        <span class="st ${k.space ? 'ok' : ''}">${k.space ? '🔗 ' + esc(k.space) : '未关联'}</span>
      </div>`).join('');
  }

  let tt = 0;
  const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800); };

  document.addEventListener('click', (e) => {
    const t = e.target;
    if (t.closest('#newTop') || t.closest('#newCard')) { $('#mask').classList.add('on'); setTimeout(() => $('#vname').focus(), 30); return; }
    if (t.closest('#cancel')) { $('#mask').classList.remove('on'); return; }
    if (t.closest('#ok')) {
      const n = $('#vname').value.trim();
      if (!n) { $('#vname').focus(); return; }
      KBS.unshift({ name:n, docs:0, space:'', hue:Math.floor(Math.random() * 360) });
      $('#mask').classList.remove('on'); $('#vname').value = '';
      render(); toast('已创建「' + n + '」'); return;
    }
    const kb = t.closest('[data-kb]');
    if (kb) { toast('打开「' + kb.dataset.kb + '」→ 文件树（mock）'); return; }
    const ev = t.closest('[data-ev]');
    if (ev) { toast('打开「' + ev.dataset.ev + '」（mock）'); return; }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#mask').classList.remove('on'); });
  $('#q').addEventListener('input', render);
  $('#theme').addEventListener('click', () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; });
  render();
})();
</script>
</body>
</html>
