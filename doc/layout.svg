<svg viewBox="0 0 680 420" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="th" x="340" y="20" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">视觉三栏效果（与用户截图对应）</text>

  <!-- Window Frame -->
  <rect x="40" y="35" width="600" height="370" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>

  <!-- TitleBar -->
  <rect x="40" y="35" width="600" height="32" rx="12" fill="#F1EFE8" stroke="none"/>
  <rect x="40" y="35" width="600" height="32" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
  <!-- Window controls -->
  <circle cx="58" cy="51" r="5" fill="#E24B4A" opacity="0.8"/>
  <circle cx="76" cy="51" r="5" fill="#EF9F27" opacity="0.8"/>
  <circle cx="94" cy="51" r="5" fill="#1D9E75" opacity="0.8"/>
  <text class="ts" x="340" y="51" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5F5E5A">TitleBar — Session Picker / Run Script / Account</text>

  <!-- Column 1: Sidebar -->
  <rect x="40" y="67" width="130" height="338" rx="0" fill="#FAFAF8" stroke="#D3D1C7" stroke-width="0.5"/>
  <text class="th" x="105" y="85" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#444441">Sidebar</text>
  <!-- Activity Bar Icons -->
  <rect x="48" y="100" width="20" height="20" rx="4" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
  <rect x="48" y="126" width="20" height="20" rx="4" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <rect x="48" y="152" width="20" height="20" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <!-- Content area -->
  <rect x="76" y="100" width="86" height="120" rx="4" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
  <text class="ts" x="119" y="120" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#888780">Sessions</text>
  <text class="ts" x="119" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#888780">Workspaces</text>
  <text class="ts" x="119" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#B4B2A9">tree view...</text>

  <!-- Column 2: File Zone (Editor Left) -->
  <rect x="170" y="67" width="200" height="338" rx="0" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
  <!-- Tab bar -->
  <rect x="170" y="67" width="200" height="28" rx="0" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="175" y="71" width="80" height="20" rx="4" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text class="ts" x="215" y="81" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#0C447C">核心特征.md</text>
  <text class="ts" x="295" y="81" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#888780">+</text>
  <!-- Content -->
  <text class="ts" x="185" y="110" font-family="sans-serif" font-size="10" fill="#2C2C2A"># 核心特征</text>
  <text class="ts" x="185" y="128" font-family="sans-serif" font-size="9" fill="#5F5E5A">文本编辑器区域</text>
  <text class="ts" x="185" y="146" font-family="sans-serif" font-size="9" fill="#5F5E5A">workspace header</text>
  <rect x="185" y="160" width="170" height="60" rx="4" fill="#FAFAF8" stroke="#D3D1C7" stroke-width="0.5"/>
  <text class="ts" x="195" y="178" font-family="sans-serif" font-size="9" fill="#5F5E5A">对比表格：有这些</text>
  <text class="ts" x="195" y="192" font-family="sans-serif" font-size="9" fill="#5F5E5A">特征 vs 没有这些</text>
  <text class="ts" x="195" y="206" font-family="sans-serif" font-size="9" fill="#5F5E5A">特征</text>

  <!-- Column 3: Agent Zone (Editor Right) -->
  <rect x="370" y="67" width="270" height="338" rx="0" fill="#FAFAF8" stroke="#D3D1C7" stroke-width="0.5"/>
  <!-- Tab bar -->
  <rect x="370" y="67" width="270" height="28" rx="0" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="375" y="71" width="60" height="20" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text class="ts" x="405" y="81" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#633806">Canvas</text>
  <rect x="440" y="71" width="60" height="20" rx="4" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
  <text class="ts" x="470" y="81" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#5F5E5A">Chat</text>
  <rect x="505" y="71" width="80" height="20" rx="4" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
  <text class="ts" x="545" y="81" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#5F5E5A">TaskBoard</text>
  <!-- Toolbar -->
  <rect x="375" y="100" width="260" height="24" rx="4" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
  <text class="ts" x="505" y="112" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#888780">Agent Studio 工具栏 (32px)</text>
  <!-- Content -->
  <rect x="375" y="130" width="260" height="260" rx="4" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
  <text class="ts" x="505" y="200" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5F5E5A">Agent Studio 编辑器区域</text>
  <text class="ts" x="505" y="220" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#888780">(WebView / React / ReactFlow)</text>

  <!-- Column Labels -->
  <text class="th" x="105" y="395" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="500" fill="#993C1D">Column 1</text>
  <text class="ts" x="105" y="410" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#D85A30">Sidebar Part</text>

  <text class="th" x="270" y="395" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="500" fill="#72243E">Column 2</text>
  <text class="ts" x="270" y="410" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#D4537E">Editor → File Zone</text>

  <text class="th" x="505" y="395" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="500" fill="#633806">Column 3</text>
  <text class="ts" x="505" y="410" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#BA7517">Editor → Agent Zone</text>

  <!-- Size annotations -->
  <text class="ts" x="105" y="430" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#888780">~250px</text>
  <text class="ts" x="270" y="430" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#888780">~30%</text>
  <text class="ts" x="505" y="430" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="9" fill="#888780">~70%</text>
</svg>