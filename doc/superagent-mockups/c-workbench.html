<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案 C · 完整工作台（全页签 / 全状态） — SuperAgent</title>
<style>
:root,[data-theme="light"]{
  --bg:#F4F6FA;--panel:#FFFFFF;--rail:#FFFFFF;--soft:#F8FAFC;--line:#E2E8F0;--line2:#CBD5E1;
  --fg:#0F172A;--muted:#475569;--dim:#94A3B8;--brand:#2563EB;--brand-soft:#DBEAFE;
  --ok:#15803D;--warn:#B45309;--err:#B91C1C;--violet:#7C3AED;--cyan:#0891B2;
  --shadow:0 1px 2px rgba(15,23,42,.05);--r:10px;--mono:ui-monospace,Consolas,monospace;
}
[data-theme="dark"]{--bg:#0B1220;--panel:#131E31;--rail:#0F1A2C;--soft:#18263D;--line:#26364F;--line2:#38506F;--fg:#E2E8F0;--muted:#A6B6CF;--dim:#7C8EAA;--brand:#60A5FA;--brand-soft:#1E3A5F;--ok:#34D399;--warn:#FBBF24;--err:#F87171;--violet:#A78BFA;--cyan:#22D3EE;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.55}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:206px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:16px 11px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;padding:6px 9px 16px;white-space:nowrap}
.brand svg{width:21px;height:21px;color:var(--brand)}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:9px 11px;border:0;border-radius:8px;background:transparent;color:var(--muted);text-align:left}
.navbtn svg{width:18px;height:18px;flex:none}
.navbtn:hover{background:var(--soft);color:var(--fg)}
.navbtn[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:650}
.railsec{margin-top:16px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:0 11px 6px}
.railfoot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;font-size:11px;color:var(--dim);line-height:1.8}
.railfoot a{color:var(--brand);border-bottom:1px solid var(--line2)}
.main{display:flex;flex-direction:column;min-width:0}
.bar{display:flex;align-items:center;gap:11px;padding:11px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;position:sticky;top:0;z-index:10}
.crumb{font-weight:650;font-size:15px;white-space:nowrap}
.crumb span{color:var(--dim);font-weight:400;font-size:11px;margin-left:7px}
.search{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:7px 11px;max-width:300px;flex:1;min-width:140px}
.search svg{width:16px;height:16px;color:var(--dim);flex:none}
.search input{border:0;background:transparent;outline:0;width:100%;min-width:0;font-size:12px}
.health{display:flex;gap:9px;align-items:center;font-size:11px;color:var(--muted);flex-wrap:wrap}
.health i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:4px}
.health i.err{background:var(--err)}.health i.off{background:var(--dim)}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;min-height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;color:var(--muted);font-size:11px}
.iconbtn:hover{border-color:var(--line2);color:var(--fg)}
.iconbtn svg{width:15px;height:15px}
.statebar{display:flex;align-items:center;gap:7px;padding:9px 20px;background:var(--soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.statebar .lbl{font-size:11px;color:var(--dim);margin-right:3px}
.state{min-height:34px;padding:6px 12px;border:1px solid var(--line);background:var(--panel);border-radius:999px;font-size:11px;color:var(--muted)}
.state:hover{border-color:var(--brand)}
.state[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.statebar .counter{margin-left:auto;font-size:11px;color:var(--dim);font-family:var(--mono)}
.workspace{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(300px,.88fr);gap:0;flex:1;min-height:0}
.queue{padding:20px;border-right:1px solid var(--line);min-width:0}
.context{padding:20px;background:var(--panel);min-width:0}
.sechead{display:flex;align-items:baseline;gap:10px;margin:0 0 13px}
.sechead h2{font-size:12px;font-weight:650;margin:0;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.sechead .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
.banner{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-left:3px solid var(--tone,var(--brand));background:var(--panel);border-radius:var(--r);padding:12px 14px;margin-bottom:13px}
.banner svg{width:18px;height:18px;color:var(--tone);flex:none;margin-top:1px}
.banner b{display:block;font-size:13px;margin-bottom:2px}
.banner p{margin:0;font-size:12px;color:var(--muted)}
.banner .act{margin-left:auto;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 15px;margin-bottom:11px;transition:border-color .2s,box-shadow .2s}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--brand);box-shadow:0 3px 14px rgba(37,99,235,.12)}
.card.priority{border-left:3px solid var(--warn)}
.card.done{border-left:3px solid var(--ok)}
.card.err{border-left:3px solid var(--err)}
.card h3{margin:0 0 6px;font-size:14px;font-weight:620}
.card .m{font-size:11px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.card p.desc{margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.7}
.tag{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);white-space:nowrap;background:var(--soft)}
.tag.b{color:var(--brand);border-color:var(--brand);background:var(--brand-soft)}
.tag.w{color:var(--warn);border-color:var(--warn)}
.tag.g{color:var(--ok);border-color:var(--ok)}
.tag.r{color:var(--err);border-color:var(--err)}
.tag.v{color:var(--violet);border-color:var(--violet)}
.tag.c{color:var(--cyan);border-color:var(--cyan)}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.btn{min-height:40px;padding:8px 13px;border-radius:8px;border:1px solid transparent;font-size:12px;font-weight:600}
.btn.p{background:var(--brand);color:#fff}.btn.p:hover{filter:brightness(1.08)}
.btn.o{background:transparent;border-color:var(--line2);color:var(--fg)}.btn.o:hover{background:var(--soft)}
.btn.t{background:transparent;color:var(--muted);padding:8px 5px}.btn.t:hover{color:var(--fg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.progress{height:5px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--brand);border-radius:99px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;margin-top:10px}
.node{background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
.node.done{color:var(--ok);border-color:var(--ok)}
.node.run{color:var(--brand);border-color:var(--brand);background:var(--brand-soft)}
.node.wait{color:var(--dim)}
.arrow{color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:9px}
th{text-align:left;color:var(--dim);font-weight:500;padding:6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.mono{font-family:var(--mono)}
.emptybox{text-align:center;padding:44px 20px;background:var(--panel);border:1px dashed var(--line2);border-radius:var(--r);color:var(--muted)}
.emptybox svg{width:34px;height:34px;color:var(--dim);margin-bottom:10px}
.emptybox h3{font-size:14px;color:var(--fg);margin:0 0 5px}
.emptybox p{font-size:12px;margin:0 0 14px}
.skel{height:12px;border-radius:5px;background:linear-gradient(90deg,var(--line),var(--soft),var(--line));background-size:200% 100%;animation:sh 1.3s linear infinite}
.skel.w60{width:60%}.skel.w40{width:40%}.skel.w80{width:80%}.skel.h{height:22px;margin-bottom:9px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.ctx-title{font-size:17px;font-weight:650;margin:0 0 3px}
.ctx-sub{font-size:11px;color:var(--dim);margin-bottom:16px}
.block{border-top:1px solid var(--line);padding:14px 0}.block:first-of-type{border-top:0;padding-top:0}
.block h4{margin:0 0 9px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.metric{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px;text-align:center}
.metric b{display:block;font-family:var(--mono);font-size:16px}
.metric span{font-size:10px;color:var(--dim)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}.kv b{font-family:var(--mono);font-weight:600}
.note{font-size:11px;color:var(--dim);line-height:1.75;margin-top:9px}
.field{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:9px;background:var(--panel)}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.field .val{font-size:13px;font-family:var(--mono);word-break:break-all}
.field .val.text{font-family:inherit}
.field .hint{font-size:10px;color:var(--dim);margin-top:4px}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.switchrow:last-child{border:0}
.toggle{width:38px;height:22px;border-radius:99px;border:1px solid var(--line2);background:var(--soft);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:transform .2s}
.toggle[aria-checked="true"]{background:var(--brand);border-color:var(--brand)}
.toggle[aria-checked="true"]::after{transform:translateX(16px);background:#fff}
.views{display:flex;gap:5px;margin-bottom:11px;flex-wrap:wrap}
.view{min-height:34px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;font-size:11px;color:var(--muted)}
.view[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.board{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:7px}
.bcol{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:7px;min-height:90px}
.bcol h5{margin:0 0 7px;font-size:10px;color:var(--muted);display:flex;justify-content:space-between}
.bitem{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px;font-size:10px;margin-bottom:5px}
.flow{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:10px}
.flow span{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.flow span.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.footer{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 20px;border-top:1px solid var(--line);background:var(--panel);font-size:10px;color:var(--dim);flex-wrap:wrap}
.footer code{font-family:var(--mono);color:var(--brand)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--fg);color:var(--bg);padding:11px 15px;border-radius:9px;font-size:12px;opacity:0;transform:translateY(9px);pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.on{opacity:1;transform:none}
@media(max-width:1100px){.workspace{grid-template-columns:1fr}.queue{border-right:0;border-bottom:1px solid var(--line)}}
@media(max-width:760px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:9px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 10px 0 3px}.railfoot,.railsec{display:none}.navbtn{width:auto;white-space:nowrap}.bar{position:static;padding:10px 13px}.search{order:6;flex-basis:100%;max-width:none}.statebar{padding:8px 13px}.queue,.context{padding:14px}.board{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="主导航">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 12h.01M15 12h.01M9 16h6"/></svg>SuperAgent</div>
    <div class="railsec">工作台</div>
    <div id="nav"></div>
    <div class="railfoot">方案 C · 完整工作台<br><span id="railCounter">6 页签 / 33 状态</span><br><a href="c-index.html">状态矩阵</a> · <a href="index.html">方案对比</a><br>示例数据，未接入运行时</div>
  </nav>

  <div class="main">
    <header class="bar">
      <div class="crumb" id="crumb">概况<span>工作台 / 概况</span></div>
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="搜索工单、线程、触发或链接" aria-label="搜索工单、线程、触发或链接"></label>
      <div class="health" id="health"></div>
      <button class="iconbtn" id="theme" aria-label="切换明暗主题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>明暗</button>
      <button class="iconbtn" data-toast="术语表：解释工单、触发、评估、组队方案等概念" aria-label="术语表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.7v.3M12 17h.01"/></svg></button>
    </header>
    <div class="statebar" id="statebar"></div>
    <div class="workspace">
      <div class="queue" id="queue"></div>
      <aside class="context" id="context" aria-label="常驻上下文列"></aside>
    </div>
    <div class="footer"><span id="footLeft">方案 C · 分栏工作区</span><span><code id="footUrl">?tab=overview&amp;state=normal</code> · URL 参数可直达任意页签与状态</span><span>无侧栏弹出 · 无 @ 提及 · 仅显示已消耗 tokens</span></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const I={overview:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',source:'<path d="M4 6h16M4 12h16M4 18h10"/>',trigger:'<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/>',eval:'<circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/>',execution:'<path d="m5 12 4 4L19 6"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
const svg=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const tag=(t,k='')=>`<span class="tag ${k}">${t}</span>`;
const btn=(t,k='o',toast)=>`<button class="btn ${k}" ${toast?`data-toast="${toast}"`:''}>${t}</button>`;
const banner=(tone,title,text,action)=>`<div class="banner" style="--tone:var(--${tone})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><div><b>${title}</b><p>${text}</p></div>${action?`<div class="act">${action}</div>`:''}</div>`;
const card=o=>`<article class="card ${o.tone||''} ${o.click?'click':''}" ${o.toast?`data-toast="${o.toast}"`:''}><h3>${o.title}</h3>${o.tags||o.meta?`<div class="m">${[o.tags,o.meta].filter(Boolean).join('')}</div>`:''}${o.desc?`<p class="desc">${o.desc}</p>`:''}${o.chain||''}${o.table||''}${o.progress!==undefined?`<div class="progress"><span style="width:${o.progress}%"></span></div>`:''}${o.actions?`<div class="actions">${o.actions}</div>`:''}${o.extra||''}</article>`;
const table=(head,rows)=>`<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const chain=(items)=>`<div class="chain">${items.map((x,i)=>`${i?'<span class="arrow">→</span>':''}<span class="node ${x[1]||''}">${x[0]}</span>`).join('')}</div>`;
const emptybox=(title,text,action)=>`<div class="emptybox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 10h8M8 14h5"/></svg><h3>${title}</h3><p>${text}</p>${action||''}</div>`;
const skeleton=(n=4)=>Array.from({length:n},()=>`<div class="card"><div class="skel h w40"></div><div class="skel w80"></div><div style="height:9px"></div><div class="skel w60"></div></div>`).join('');
const block=(title,body)=>`<div class="block"><h4>${title}</h4>${body}</div>`;
const metrics=(items)=>`<div class="metrics">${items.map(x=>`<div class="metric"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>`;
const kv=(rows)=>rows.map(x=>`<div class="kv"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
const field=(label,val,hint,cls='')=>`<div class="field"><label>${label}</label><div class="val ${cls}">${val}</div>${hint?`<div class="hint">${hint}</div>`:''}</div>`;
const switchrow=(label,on,toast)=>`<div class="switchrow"><span>${label}</span><button class="toggle" role="switch" aria-checked="${on}" aria-label="${label}" ${toast?`data-toast="${toast}"`:''}></button></div>`;

const TICKET='修复 TAPD 缺陷：导出报表为空', LOGIN='修复登录页点击无响应', UNIT='补充导出接口单元测试';
const decideActions=btn('同意并开工','p','已同意并开工：团队步骤正在启动')+btn('取消工单','o','已写入取消原因，工单待你确认后结束')+btn('查看完整方案','t','展开完整方案：角色 / 步骤 / 权限 / 风险');
const approvalActions=btn('允许一次','o','已允许一次，越权仅对本次生效')+btn('允许并记住','o','已记住规则：该 bot 可写 src/ 目录')+btn('拒绝','t','已拒绝，步骤重新排队');
const stepsTable=table(['步骤','负责 bot','权限','状态','回合'],[['定位复现','排查 bot','只读',tag('完成','g'),'4'],['根因分析','排查 bot','只读',tag('完成','g'),'7'],['编码实现','开发 bot','写',tag('进行中','b')+' 查找 src/report.ts','3'],['回归验证','测试 bot','只读','等待','—'],['结果汇报','领队','—','等待','—']]);

const PAGES={
 overview:{label:'概况',states:['normal','dense','empty','loading','error','paused'],render(s){

const stateLabels={normal:'正常',dense:'信息密集',empty:'空态',loading:'加载中',error:'异常',paused:'已暂停',ready:'全部就绪',off:'已关闭',filtered:'被过滤',list:'列表',detail:'线程详情',candidates:'候选在途',fasttrack:'快速通道',overdue:'超时',running:'执行中',waiting:'等待新触发',attention:'待人回答',completed:'已结束',source:'来源',eval:'评估',execution:'执行',prompts:'提示词',deployment:'部署',conflict:'保存冲突'};
const params=new URLSearchParams(location.search);
let tab=params.get('tab')||'overview',state=params.get('state')||PAGES[tab]?.states[0]||'normal',theme=params.get('theme')||'light';
if(!PAGES[tab])tab='overview';if(!PAGES[tab].states.includes(state))state=PAGES[tab].states[0];
document.documentElement.setAttribute('data-theme',theme);
const toast=document.getElementById('toast');let timer;
function say(t){toast.textContent=t;toast.classList.add('on');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('on'),2400)}
function render(){
  document.getElementById('nav').innerHTML=Object.entries(PAGES).map(([k,p])=>`<button class="navbtn" data-tab="${k}" ${k===tab?'aria-current="page"':''}>${svg(k)}${p.label}</button>`).join('');
  document.getElementById('crumb').innerHTML=`${PAGES[tab].label}<span>工作台 / ${PAGES[tab].label} / ${stateLabels[state]||state}</span>`;
  document.getElementById('statebar').innerHTML=`<span class="lbl">状态：</span>${PAGES[tab].states.map(s=>`<button class="state" data-state="${s}" aria-pressed="${s===state}">${stateLabels[s]||s}</button>`).join('')}<span class="counter">${PAGES[tab].states.indexOf(state)+1} / ${PAGES[tab].states.length}</span>`;
  document.getElementById('health').innerHTML=tab==='source'&&state==='error'?'<span><i></i>飞书</span><span><i></i>TAPD</span><span><i class="err"></i>GitHub</span>':'<span><i></i>飞书</span><span><i></i>TAPD</span><span><i class="off"></i>GitHub</span>';
  const page=PAGES[tab].render(state);
  document.getElementById('queue').innerHTML=page.banner+page.queue;
  document.getElementById('context').innerHTML=page.context;
  const url=`?tab=${tab}&state=${state}&theme=${theme}`;
  document.getElementById('footUrl').textContent=url;
  document.getElementById('footLeft').textContent=`方案 C · ${PAGES[tab].label} · ${stateLabels[state]||state}`;
  document.getElementById('railCounter').textContent=`${Object.keys(PAGES).length} 页签 / ${Object.values(PAGES).reduce((n,p)=>n+p.states.length,0)} 状态`;
  history.replaceState(null,'',url);
  wire();
}
function wire(){
  document.querySelectorAll('[data-toast]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();say(el.dataset.toast)}));
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;state=PAGES[tab].states[0];render()}));
  document.querySelectorAll('[data-state]').forEach(b=>b.addEventListener('click',()=>{state=b.dataset.state;render()}));
  document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>{state=b.dataset.goto;render()}));
  document.querySelectorAll('.toggle').forEach(b=>b.addEventListener('click',()=>{const on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',String(on));say(on?'已开启':'已关闭')}));
  document.querySelectorAll('.view[data-toast]').forEach(b=>b.addEventListener('click',()=>{b.parentElement.querySelectorAll('.view').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
}
document.getElementById('theme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',theme);say(theme==='dark'?'已切到深色':'已切到浅色');render()});
document.getElementById('q').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('#queue .card,#queue .emptybox').forEach(c=>c.style.display=!q||c.textContent.toLowerCase().includes(q)?'':'none')});
render();
</script>
