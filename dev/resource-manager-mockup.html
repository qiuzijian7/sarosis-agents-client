<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ResourceManager EditorPane - Mockup</title>
<style>
/* ===== VS Code Theme ===== */
:root {
  --vscode-editor-background: #1e1e1e;
  --vscode-editorForeground: #d4d4d4;
  --vscode-sideBar-background: #252526;
  --vscode-titleBar-activeBackground: #323233;
  --vscode-tab-activeBackground: #1e1e1e;
  --vscode-tab-inactiveBackground: #2d2d2d;
  --vscode-tab-activeForeground: #ffffff;
  --vscode-tab-inactiveForeground: #969696;
  --vscode-borderColor: #3c3c3c;
  --vscode-widget-background: #252526;
  --vscode-list-hoverBackground: #2a2d2e;
  --vscode-list-activeSelectionBackground: #094771;
  --vscode-list-activeSelectionForeground: #ffffff;
  --vscode-button-background: #0e639c;
  --vscode-button-foreground: #ffffff;
  --vscode-button-secondaryBackground: #3a3d41;
  --vscode-badge-background: #4d4d4d;
  --vscode-badge-foreground: #ffffff;
  --vscode-textLink-foreground: #3794ff;
  --vscode-descriptionForeground: #9d9d9d;
  --vscode-focusBorder: #007fd4;
  --vscode-input-background: #3c3c3c;
  --vscode-input-foreground: #cccccc;
  --vscode-icon-foreground: #c5c5c5;
  --vscode-scrollbarSlider-background: rgba(121,121,121,0.4);
  --vscode-scrollbarSlider-hoverBackground: rgba(100,100,100,0.7);

  /* Tag colors */
  --tag-safe-bg: rgba(46,160,67,0.12);
  --tag-safe-fg: #3fb950;
  --tag-warn-bg: rgba(210,153,34,0.12);
  --tag-warn-fg: #e3b341;
  --tag-info-bg: rgba(56,139,253,0.12);
  --tag-info-fg: #58a6ff;
  --tag-knot-bg: rgba(230,126,34,0.10);
  --tag-knot-fg: #e67e22;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 13px; line-height: 1.5;
  background: var(--vscode-editor-background);
  color: var(--vscode-editorForeground);
  height: 100vh; overflow: hidden;
}
.app { display: flex; flex-direction: column; height: 100vh; }

/* ===== Title Bar ===== */
.titlebar {
  height: 30px; display: flex; align-items: center;
  background: var(--vscode-titleBar-activeBackground); color: #fff;
  padding: 0 14px; font-size: 12px; border-bottom: 1px solid var(--vscode-borderCode-color);
}
.titlebar-brand { font-weight: 600; margin-right: 16px; }
.titlebar-menu { color: #ccc; cursor: pointer; margin-right: 12px; opacity: 0.8; }
.titlebar-menu:hover { opacity: 1; }
.titlebar-center { flex: 1; text-align: center; color: rgba(255,255,255,0.5); font-size: 11px; }

/* ===== Workspace Layout ===== */
.workspace { display: flex; flex: 1; overflow: hidden; }

/* Activity Bar */
.activity-bar {
  width: 48px; background: var(--vscode-sideBar-background);
  border-right: 1px solid var(--vscode-borderColor);
  display: flex; flex-direction: column; align-items: center; padding-top: 4px;
}
.act-icon {
  width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--vscode-icon-foreground); font-size: 18px; opacity: 0.65;
  position: relative;
}
.act-icon:hover { opacity: 1; }
.act-icon.active { opacity: 1; color: #fff; }
.act-icon.active::before {
  content:''; position:absolute; left:0; top:6px; bottom:6px; width:2px;
  background:#fff; border-radius:0 2px 2px 0;
}
.act-bar-bottom { margin-top:auto; padding-bottom:8px; }

/* ===== LEFT SIDEBAR: Resource List ===== */
.sidebar {
  width: 300px; min-width: 270px;
  background: var(--vscode-sideBar-background);
  border-right: 1px solid var(--vscode-borderColor);
  display: flex; flex-direction: column;
}

/* Type Tabs */
.type-tabs {
  display: flex; border-bottom: 1px solid var(--vscode-borderColor);
  background: var(--vscode-sideBar-background);
}
.type-tab {
  flex:1; display:flex; align-items:center; justify-content:center; gap:4px;
  padding:9px 4px; cursor:pointer; font-size:12px; color:var(--vscode-descriptionForeground);
  border-right:1px solid var(--vscode-borderColor); position:relative;
}
.type-tab:hover{color:#fff;}
.type-tab.active{
  color:var(--vscode-tab-activeForeground);
  background:var(--vscode-tab-activeBackground);
  border-bottom:2px solid var(--vscode-focusBorder);
}

/* Section header */
.sec-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--vscode-descriptionForeground);border-bottom:1px solid var(--vscode-borderColor);
}
.btn-install-sm{
  background:var(--vscode-button-background);color:#fff;border:none;
  padding:2px 10px;border-radius:3px;font-size:11px;cursor:pointer;
}
.btn-install-sm:hover{filter:brightness(1.15);}

/* Search */
.search-area{padding:7px 10px;}
.search-wrap{position:relative;}
.search-input{
  width:100%;padding:5px 10px;padding-left:28px;
  background:var(--vscode-input-background);border:1px solid transparent;
  color:var(--vscode-input-foreground);border-radius:3px;font-size:12px;outline:none;
}
.search-input:focus{border-color:var(--vscode-focusBorder);}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--vscode-descriptionForeground);}

/* Filter chips */
.filter-chips{display:flex;flex-wrap:wrap;gap:4px;padding:4px 10px 10px;}
.chip{
  padding:2px 8px;border-radius:3px;font-size:11px;cursor:pointer;
  background:rgba(255,255,255,0.04);color:var(--vscode-descriptionForeground);
  border:1px solid transparent;transition:all .12s;
}
.chip:hover{border-color:var(--vscode-borderColor);}
.chip.on{background:var(--vscode-list-activeSelectionBackground);color:#fff;}

/* Resource list */
.res-list{flex:1;overflow-y:auto;}
.res-item{
  display:flex;flex-direction:column;padding:8px 14px;cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,0.02);transition:background .1s;
}
.res-item:hover{background:var(--vscode-list-hoverBackground);}
.res-item.on{background:var(--vscode-list-activeSelectionBackground);}
.item-top{display:flex;align-items:center;gap:6px;}
.item-arrow{width:16px;text-align:center;color:var(--vscode-descriptionForeground);font-size:11px;cursor:pointer;flex-shrink:0;}
.item-name{font-size:13px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-badges{display:flex;gap:3px;flex-shrink:0;}
.badge{font-size:10px;padding:1px 6px;border-radius:2px;font-weight:500;}
.badge-auto{background:var(--tag-info-bg);color:var(--tag-info-fg);}
.badge-manual{background:var(--tag-warn-bg);color:var(--tag-warn-fg);}
.badge-always{background:var(--tag-safe-bg);color:var(--tag-safe-fg);}
.badge-safe{background:var(--tag-safe-bg);color:var(--tag-safe-fg);}
.badge-builtin{background:rgba(150,150,150,0.12);color:#999;}
.item-desc{
  font-size:11px;color:var(--vscode-descriptionForeground);margin-top:3px;
  line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:22px;
}
.item-src{
  font-size:10px;color:var(--vscode-textLink-foreground);margin-top:2px;padding-left:22px;display:flex;align-items:center;gap:4px;
}

/* ===== CENTER: EDITOR PANE (Skill/MCP style) ===== */
.editor-pane{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
  background:var(--vscode-editor-background);
}

/* === Pane Header (matches screenshot) === */
.pane-header{
  padding:14px 20px 12px;border-bottom:1px solid var(--vscode-borderColor);
  background:var(--vscode-editor-background);flex-shrink:0;
}
.ph-row1{display:flex;align-items:center;gap:10px;}
.ph-icon{
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0;
}
.ph-icon-skill{background:linear-gradient(135deg,#9b59b6,#8e44ad);}
.ph-icon-mcp{background:linear-gradient(135deg,#f39c12,#e67e22);}
.ph-icon-tool{background:linear-gradient(135deg,#1abc9c,#16a085);}
.ph-icon-knowledge{background:linear-gradient(135deg,#3498db,#2980b9);}
.ph-icon-workflow{background:linear-gradient(135deg,#e74c3c,#c0392b);}

.ph-title{font-size:20px;font-weight:600;flex:1;}
.ph-star{cursor:pointer;opacity:0.55;font-size:16px;margin-left:4px;}
.ph-star:hover{opacity:1;}

.ph-actions{display:flex;gap:8px;flex-shrink:0;align-items:center;}
.btn-ph{
  background:var(--vscode-button-background);color:#fff;border:none;
  padding:5px 14px;border-radius:3px;cursor:pointer;font-size:12px;
  display:flex;align-items:center;gap:4px;
}
.btn-ph:hover{filter:brightness(1.12);}
.btn-ph-close{
  background:none;border:none;color:var(--vscode-icon-foreground);
  cursor:pointer;font-size:20px;line-height:1;padding:4px 8px;
}
.btn-ph-close:hover{color:#fff;}

.ph-meta{display:flex;gap:18px;margin-top:6px;font-size:12px;color:var(--vscode-descriptionForeground);}
.ph-meta i{margin-right:3px;font-style:normal;}
.ph-tags{display:flex;gap:6px;margin-top:8px;}
.tag-pill{
  padding:2px 10px;border-radius:12px;font-size:11px;border:1px solid transparent;
}
.tag-pill-safe{background:var(--tag-safe-bg);color:var(--tag-safe-fg);border-color:var(--tag-safe-fg)35;}
.tag-pill-office{background:var(--tag-info-bg);color:var(--tag-info-fg);border-color:var(--tag-info-fg)35;}
.tag-pill-knot{color:var(--tag-knot-fg);border-color:var(--tag-knot-fg)40;background:var(--tag-knot-bg);}

/* === Tab Navigation (matches screenshot) === */
.pane-tabs{
  display:flex;gap:0;border-bottom:1px solid var(--vscode-borderColor);
  padding:0 20px;background:var(--vscode-editor-background);flex-shrink:0;
}
.ptab{
  padding:10px 16px;background:none;border:none;color:var(--vscode-tab-inactiveForeground);
  cursor:pointer;font-size:13px;position:relative;border-bottom:2px solid transparent;
  transition:all .15s;
}
.ptab:hover{color:var(--vscode-tab-activeForeground);}
.ptab.on{color:var(--vscode-tab-activeForeground);border-bottom-color:var(--vscode-button-background);font-weight:500;}

/* === Content Area === */
.pane-body{flex:1;overflow-y:auto;padding:20px 24px;}

/* --- Usage content (使用说明) --- */
.usage-content h1{font-size:20px;margin-bottom:10px;}
.usage-content h2{font-size:16px;margin:18px 0 8px;color:var(--vscode-textLink-foreground);}
.usage-content p{margin-bottom:8px;line-height:1.7;}
.usage-content ol,.usage-content ul{padding-left:20px;margin-bottom:8px;}
.usage-content li{margin-bottom:3px;line-height:1.6;}
.usage-content code{
  background:#333;padding:1px 5px;border-radius:3px;
  font-family:'Cascadia Code',Consolas,monospace;font-size:12px;color:#ce9178;
}
.usage-content pre{
  background:#1a1a1a;padding:12px 16px;border-radius:4px;
  border:1px solid var(--vscode-borderColor);overflow-x:auto;margin:8px 0;font-size:12px;
}
.usage-content pre code{background:none;padding:0;color:#d4d4d4;}
.usage-content strong{color:#fff;}

/* Score summary */
.score-box{
  background:var(--vscode-widget-background);border:1px solid var(--vscode-borderColor);
  border-radius:4px;padding:14px 18px;margin:14px 0;
}
.score-head{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.score-total{font-size:26px;font-weight:700;color:var(--tag-safe-fg);}
.score-max{font-size:14px;color:var(--vscode-descriptionForeground);}
.score-grade{padding:2px 10px;border-radius:3px;font-size:12px;font-weight:600;}
.grade-pass{background:var(--tag-safe-bg);color:var(--tag-safe-fg);}
.grade-warn{background:var(--tag-warn-bg);color:var(--tag-warn-fg);}
.score-verdict{font-size:13px;color:var(--vscode-descriptionForeground);}

/* Score table */
.stbl{width:100%;border-collapse:collapse;margin:12px 0;font-size:12px;}
.stbl th,.stbl td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--vscode-borderColor);}
.stbl th{color:var(--vscode-descriptionForeground);font-weight:500;width:110px;}
.stbl th.sc{width:42px;text-align:center;}
.stbl td.sn{text-align:center;font-weight:600;}
.sg{color:var(--tag-safe-fg);}
.sm{color:var(--tag-warn-fg);}
.sb{color:#f85149;}

/* File tree panel (文件) */
.file-layout{display:flex;gap:0;height:100%;min-height:400px;}
.file-tree{
  width:240px;min-width:200px;border-right:1px solid var(--vscode-borderColor);
  overflow-y:auto;padding:6px 0;
}
.ft-hdr{display:flex;align-items:center;gap:6px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--vscode-descriptionForeground);}
.ft-node{display:flex;align-items:center;padding:4px 14px;cursor:pointer;font-size:12px;}
.ft-node:hover{background:var(--vscode-list-hoverBackground);}
.ft-node.on{background:var(--vscode-list-activeSelectionBackground);}
.ft-icon{width:18px;margin-right:6px;text-align:center;}
.ft-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ft-size{color:var(--vscode-descriptionForeground);font-size:11px;margin-left:8px;}
.ft-folder>.ft-node{font-weight:500;}
.ft-children{display:none;}
.ft-folder.open>.ft-children{display:block;}

.file-preview{
  flex:1;overflow-y:auto;padding:14px 18px;background:var(--vscode-editor-background);
}
.fp-hdr{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--vscode-borderColor);margin-bottom:12px;font-size:12px;color:var(--vscode-descriptionForeground);}
.fp-body{line-height:1.7;font-size:13px;}
.fp-body h2{font-size:16px;margin-bottom:8px;color:#fff;}
.fp-body code{background:#333;padding:1px 5px;border-radius:3px;font-size:12px;}
.fp-key{color:#9cdcfe;}
.fp-str{color:#ce9178;}

.qref-tbl{width:100%;max-width:520px;border-collapse:collapse;margin:12px 0;font-size:12px;border:1px solid var(--vscode-borderColor);}
.qref-tbl th,.qref-tbl td{padding:7px 12px;text-align:left;border:1px solid var(--vscode-borderColor);}
.qref-tbl th{background:var(--vscode-widget-background);font-weight:600;width:140px;}
.qref-tbl td code{background:none;color:var(--vscode-textLink-foreground);}

/* Version history */
.vitem{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--vscode-borderColor);}
.vdot{width:8px;height:8px;border-radius:50%;background:var(--tag-safe-fg);flex-shrink:0;margin-top:5px;}
.vnum{font-weight:600;font-size:14px;}
.vbadge{font-size:10px;padding:1px 7px;border-radius:3px;background:var(--tag-warn-bg);color:var(--tag-warn-fg);}
.vdate{margin-left:auto;color:var(--vscode-descriptionForeground);font-size:12px;}
.vauth{color:var(--vscode-textLink-foreground);font-size:12px;margin-left:4px;}
.vnote{color:var(--vscode-descriptionForeground);font-size:12px;margin-left:28px;margin-top:2px;}

/* MCP Tool Description cards */
.tcard{
  background:var(--vscode-widget-background);border:1px solid var(--vscode-borderColor);
  border-radius:4px;padding:14px 16px;margin-bottom:12px;transition:border-color .15s;
}
.tcard:hover{border-color:var(--vscode-focusBorder);}
.tname{font-size:14px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.tname code{background:#333;padding:2px 8px;border-radius:3px;font-size:12px;}
.tdesc{color:var(--vscode-descriptionForeground);font-size:13px;line-height:1.6;}
.tmeta{display:flex;gap:12px;margin-top:7px;font-size:11px;color:var(--vscode-descriptionForeground);}
.tparam{background:#2a2a2a;padding:10px 14px;border-radius:4px;margin-top:8px;font-size:12px;}
.tparam-title{font-weight:600;color:var(--vscode-textLink-foreground);margin-bottom:6px;font-size:11px;text-transform:uppercase;}
.tparam table{width:100%;border-collapse:collapse;}
.tparam th,.tparam td{padding:4px 8px;text-align:left;font-size:11px;border-bottom:1px solid var(--vscode-borderColor);}
.tparam th{color:var(--vscode-descriptionForeground);font-weight:500;}
.pt-type{color:#ce9178;}
.pt-req{color:#f85149;font-weight:600;}
.pt-opt{color:var(--vscode-descriptionForeground);}
.ti-safe{background:var(--tag-safe-bg);color:var(--tag-safe-fg);padding:2px 8px;border-radius:3px;font-size:11px;}
.ti-ro{background:var(--tag-info-bg);color:var(--tag-info-fg);padding:2px 8px;border-radius:3px;font-size:11px;}

/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--vscode-descriptionForeground);gap:10px;}
.empty-state .es-icon{font-size:48px;opacity:0.3;}
.empty-state .es-text{font-size:14px;}

/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--vscode-scrollbarSlider-background);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--vscode-scrollbarSlider-hoverBackground);}

/* Status bar */
.statusbar{
  height:22px;display:flex;align-items:center;padding:0 10px;
  background:#007acc;color:#fff;font-size:12px;border-top:1px solid var(--vscode-borderCode-color);
}
.si{margin-right:18px;display:flex;align-items:center;gap:4px;}
.si-r{margin-left:auto;margin-right:0;}
</style>
</head>

let currentType = 'skill';
let currentRes = null;
let currentTabIdx = 0;

// ========== RENDER ==========
function renderSidebar() {
  const items = RESOURCES[currentType];
  const listEl = document.getElementById('resList');
  listEl.innerHTML = items.map((r, i) => `
    <div class="res-item ${i===0?'on':''}" onclick="selectRes('${currentType}','${r.id}',this)">
      <div class="item-top">
        <span class="item-arrow">${i===0?'▼':'▶'}</span>
        <span class="item-name">${r.name}</span>
        <span class="item-badges">${r.badges.map(b=>`<span class="badge ${b[1]}">${b[0]}</span>`).join('')}</span>
      </div>
      <div class="item-desc">${r.desc}</div>
      ${r.src ? `<div class="item-src">${r.src}</div>` : ''}
    </div>
  `).join('');

  // Chips
  const chipsEl = document.getElementById('filterChips');
  chipsEl.innerHTML = FILTER_CHIPS.map((c,i)=>`<span class="chip ${i===0?'on':''}">${c}</span>`).join('');

  // Section title
  const typeNames = {skill:'Skills Library',tool:'Tools Library',mcp:'MCP Servers',knowledge:'Knowledge Base',workflow:'Workflows'};
  const counts = {skill:'119',tool:'38',mcp:'12',knowledge:'5',workflow:'8'};
  document.getElementById('secTitle').innerHTML = `💡 ${typeNames[currentType]} &nbsp;<span style="opacity:0.5;">1/${counts[currentType]} matched</span>`;
}

function selectRes(type, id, el) {
  document.querySelectorAll('.res-item').forEach(i=>i.classList.remove('on'));
  el.classList.add('on');
  el.querySelector('.item-arrow').textContent='▼';
  document.querySelectorAll('.res-item:not(.on)').forEach(i=>i.querySelector('.item-arrow').textContent='▶');

  const res = RESOURCES[type].find(r=>r.id===id);
  if(res){ currentRes=res; currentTabIdx=0; renderEditorPane(); }
}

function switchType(type) {
  currentType = type;
  document.querySelectorAll('.type-tab').forEach(t=>t.classList.remove('active'));
  event.currentTarget.classList.add('active');
  renderSidebar();
  if(RESOURCES[type].length > 0){
    currentRes = RESOURCES[type][0]; currentTabIdx=0;
    renderEditorPane();
  } else {
    document.getElementById('editorPane').innerHTML = `<div class="empty-state"><div class="es-icon">📭</div><div class="es-text">暂无${type==='skill'?'技能':type==='tool'?'工具':type}资源</div></div>`;
  }
}

// ========== EDITOR PANE RENDERING ==========
function renderEditorPane() {
  const r = currentRes;
  if(!r)return;

  const emoji = r.iconClass.includes('skill')?'🧠':r.iconClass.includes('mcp')?'⚡':r.iconClass.includes('tool')?'🔧':r.iconClass.includes('knowledge')?'📚':'🔄';

  let html = '';

  // ---- HEADER ----
  html += `
  <div class="pane-header">
    <div class="ph-row1">
      <div class="ph-icon ${r.iconClass}">${emoji}</div>
      <div class="ph-title">${r.name}</div>
      <span class="ph-star">☆</span>
      <div class="ph-actions">
        <button class="btn-ph">↓ 安装 ⌄</button>
        <button class="btn-ph-close">×</button>
      </div>
    </div>
    <div class="ph-meta">
      ${r.author?`<i>👤</i>作者：<a href="#" style="color:var(--vscode-textLink-foreground);text-decoration:none;">${r.author}</a>`:''}
      ${r.scope?`<i>🔗</i>共享范围：${r.scope}`:''}
      ${r.installs?`<i>⬇</i>安装量：${r.installs}`:''}
      ${r.updated?`<i>🕐</i>更新：${r.updated}`:''}
    </div>
    ${r.tags && r.tags.length ? `
    <div class="ph-tags">${r.tags.map(t=>`<span class="tag-pill ${t.cls||''}">${t.text}</span>`).join('')}</div>
    ` : ''}
  </div>`;

  // ---- TABS ----
  html += `<div class="pane-tabs">`;
  r.tabs.forEach((t,i)=>{
    html += `<button class="ptab ${i===currentTabIdx?'on':''}" onclick="switchPaneTab(${i})">${t}</button>`;
  });
  html += `</div>`;

  // ---- BODY ----
  html += `<div class="pane-body">`;
  html += renderTabContent(r.kind, r.id, currentTabIdx);
  html += `</div>`;

  document.getElementById('editorPane').innerHTML = html;
}

function switchPaneTab(idx){
  currentTabIdx = idx;
  // Re-render just the body
  const bodyEl = document.querySelector('.pane-body');
  if(bodyEl && currentRes){
    bodyEl.innerHTML = renderTabContent(currentRes.kind, currentRes.id, idx);
  }
  // Update tab styles
  document.querySelectorAll('.ptab').forEach((t,i)=>t.classList.toggle('on',i===idx));
}

function renderTabContent(kind, resId, tabIdx) {
  // ---- SKILL KIND ----
  if(kind === 'skill'){
    switch(tabIdx){
      case 0: return renderSkillUsage(resId);
      case 1: return renderSkillFiles(resId);
      case 2: return renderSkillVersion(resId);
      case 3: return renderComments();
      case 4: return renderSkillEval(resId);
    }
  }

  // ---- MCP KIND ----
  if(kind === 'mcp'){
    switch(tabIdx){
      case 0: return renderMcpDesc(resId);
      case 1: return renderMcpUsage(resId);
      case 2: return renderMcpTools(resId);
      case 3: return renderComments();
    }
  }

  // ---- TOOL KIND ----
  if(kind === 'tool'){
    switch(tabIdx){
      case 0: return renderToolUsage(resId);
      case 1: return renderToolParams(resId);
    }
  }

  // ---- KNOWLEDGE KIND ----
  if(kind === 'knowledge'){
    switch(tabIdx){
      case 0: return renderKnowledgeList();
      case 1: return `<p style="color:var(--vscode-descriptionForeground);">搜索功能...</p>`;
      case 2: return `<p style="color:var(--vscode-descriptionForeground);">统计信息...</p>`;
    }
  }

  // ---- WORKFLOW KIND ----
  if(kind === 'workflow'){
    switch(tabIdx){
      case 0: return renderWorkflowDef();
      case 1: return `<p style="color:var(--vscode-descriptionForeground);">运行记录...</p>`;
      case 2: return `<p style="color:var(--vscode-descriptionForeground);">工作流设置...</p>`;
    }
  }

  // Fallback for mcp-style items showing description first
  if(kind === 'mcp-style'){
    switch(tabIdx){
      case 0: return renderMcpDesc(resId);
      case 1: return renderMcpUsage(resId);
      case 2: return renderMcpTools(resId);
      case 3: return renderComments();
    }
  }

  return `<p>Content for ${kind}:${tabIdx}</p>`;
}

function renderMcpTools(id){
  const tools = [
    {name:'execute_sql',desc:'执行 SQL 命令，支持 SELECT / INSERT / UPDATE / DELETE 等操作。返回结果集或影响行数。',safe:true,params:[
      {name:'sql',type:'string',req:true,desc:'要执行的 SQL 语句'},
      {name:'params',type:'object[]',req:false,desc:'SQL 参数化绑定值（防 SQL 注入）'},
      {name:'timeout_ms',type:'number',req:false,desc:'超时时间（毫秒），默认 30000'}
    ]},
    {name:'list_tables',desc:'列出当前数据库连接中所有可用的数据表，包含行数估算和最后更新时间。',safe:true,params:[
      {name:'pattern',type:'string',req:false,desc:"表名过滤通配符（如 'user_*'）"}
    ]},
    {name:'get_schema',desc:'获取指定表的完整 schema 信息，包括字段名、类型、约束、索引等。',safe:true,params:[
      {name:'table_name',type:'string',req:true,desc:'目标表名'}
    ]},
    {name:'export_data',desc:'导出查询结果为 CSV 或 JSON 格式，支持分页和大小限制。',safe:false,params:[
      {name:'sql',type:'string',req:true,desc:'SELECT 查询语句'},
      {name:"format",type:"'csv'|'json'",req:false,desc:'导出格式，默认 csv'},
      {name:'limit',type:'number',req:false,desc:'最大行数限制，默认 10000'}
    ]}
  ];

  return `<div class="tool-desc-section">
${tools.map(t=>`
<div class="tcard">
  <div class="tname"><code>${t.name}</code> <span class="${t.safe?'ti-safe':'ti-ro'}">${t.safe?'Safe':'Read-Only'}</span></div>
  <div class="tdesc">${t.desc}</div>
  <div class="tmeta"><span>📥 输入：${t.params.filter(p=>p.req).map(p=>p.name).join(', ')||'—'}</span> <span style="margin-left:auto;">📤 输出：rows[], affected_rows</span></div>
  <div class="tparam">
    <div class="tparam-title">参数定义</div>
    <table>
      <tr><th>参数</th><th>类型</th><th>必填</th><th>说明</th></tr>
      ${t.params.map(p=>`<tr><td><code>${p.name}</code></td><td><span class="pt-type">${p.type}</span></td><td><span class="${p.req?'pt-req':'pt-opt'}">${p.req?'✓':'可选'}</span></td><td>${p.desc}</td></tr>`).join('')}
    </table>
  </div>
</div>`).join('')}
</div>`;
}
