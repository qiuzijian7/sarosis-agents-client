<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 才生效安全区；不写 user-scalable=no（保无障碍），缩放延迟靠 CSS touch-action 去除 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FFF3E0" />
    <title>卡通番茄钟</title>
    <link rel="stylesheet" href="/cartoon.css" />
  </head>
  <body>
    <main class="toon-app" id="app" aria-label="卡通番茄钟">
      <header class="toon-top">
        <!-- 可爱番茄 SVG（内联，无外部依赖，不使用 emoji） -->
        <svg class="toon-logo" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 8c2-3 6-4 9-2-1 2-1 4 0 6-3-1-6 0-9-1z" fill="#3FB950" />
          <path d="M16 9c1 2 1 4 0 6-2-1-4-1-6 0 1-3 3-5 6-6z" fill="#56D364" />
          <circle cx="24" cy="28" r="15" fill="#E5484D" />
          <circle cx="18" cy="24" r="2.2" fill="#3A2E2E" />
          <circle cx="30" cy="24" r="2.2" fill="#3A2E2E" />
          <path
            d="M19 32c2 2 8 2 10 0"
            stroke="#3A2E2E"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
          />
        </svg>
        <h1 class="toon-title">番茄钟</h1>
        <span class="toon-phase" id="phaseLabel">专注模式</span>
      </header>

      <section class="toon-stage" id="stage">
        <!-- 计时区装饰番茄（带表情，纯装饰 aria-hidden） -->
        <svg class="toon-tomato" viewBox="0 0 96 96" aria-hidden="true">
          <path d="M48 16c4-6 12-8 18-4-2 4-2 8 0 12-6-2-12 0-18-2z" fill="#3FB950" />
          <circle cx="48" cy="56" r="30" fill="#E5484D" />
          <circle cx="38" cy="50" r="4" fill="#3A2E2E" />
          <circle cx="58" cy="50" r="4" fill="#3A2E2E" />
          <path
            d="M38 64c4 4 16 4 20 0"
            stroke="#3A2E2E"
            stroke-width="3.5"
            fill="none"
            stroke-linecap="round"
          />
          <circle cx="32" cy="62" r="3" fill="#FF9B9B" opacity=".8" />
          <circle cx="64" cy="62" r="3" fill="#FF9B9B" opacity=".8" />
        </svg>
        <div
          class="toon-time"
          id="time"
          role="timer"
          aria-label="剩余 25 分 0 秒"
        >
          25:00
        </div>
        <p class="toon-state" id="stateLabel">准备开始</p>
      </section>

      <nav class="toon-controls" aria-label="计时控制">
        <button class="toon-btn toon-btn--primary" id="startBtn" type="button">
          开始
        </button>
        <button class="toon-btn toon-btn--break" id="pauseBtn" type="button" disabled>
          暂停
        </button>
        <button class="toon-btn toon-btn--break" id="resetBtn" type="button">
          重置
        </button>
      </nav>

      <footer class="toon-today"> 今日 <b id="todayCount">0</b> 个番茄 </footer>

      <!-- 错误态横幅：localStorage 写入失败时显示（红系，与像素版同源口径） -->
      <div class="toon-error" id="errorBanner" role="alert" hidden>
        <span
          >本地保存失败（localStorage 不可用或已满），已完成的番茄数可能无法保留。<br />
          原因：浏览器隐私模式 / 存储配额超限 / 被禁用。</span
        >
        <button class="toon-btn" id="retryBtn" type="button">重试保存</button>
      </div>
    </main>

    <script type="module" src="/src/cartoon/cartoon.js"></script>
  </body>
</html>
